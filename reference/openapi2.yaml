openapi: 3.0.1
info:
  title: Get all contacts
  version: v4
servers:
  - description: >-
      Get all the contacts filtered by user and alias, taxonomy, id or currency
      (all optional).
    url: https://api.bitso.com
tags:
  - description: Search withdrawal contacts.
    name: Contacts
paths:
  /api/v4/consumer-contacts:
    get:
      description: >-
        Get all the contacts filtered by user and alias, taxonomy, id or
        currency (all optional).
      operationId: searchContactsPaged
      parameters:
        - description: Filter by contact alias.
          example: Jane's wallet
          in: query
          name: alias
          required: false
          schema:
            type: string
        - description: Filter by contact identifier.
          example: 12345
          in: query
          name: id
          required: false
          schema:
            type: integer
            format: int64
        - description: Filter by settlement asset.
          example: mxn
          in: query
          name: asset
          required: false
          schema:
            type: string
        - description: Filter by network.
          example: spei
          in: query
          name: network
          required: false
          schema:
            type: string
        - description: Filter by protocol.
          example: clabe
          in: query
          name: protocol
          required: false
          schema:
            type: string
        - description: Filter by integration.
          example: praxis
          in: query
          name: integration
          required: false
          schema:
            type: string
        - description: Filter by currency.
          example: mxn
          in: query
          name: currency
          required: false
          schema:
            type: string
        - description: Opaque cursor for the next page.
          in: query
          name: page_token
          required: false
          schema:
            type: string
        - description: Maximum number of contacts per page.
          example: 20
          in: query
          name: page_size
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsSearchPagedResponse'
          description: Matching contacts, paginated.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/SearchContactsPagedBadRequestErrorResponse
                  - $ref: '#/components/schemas/BadRequestErrorResponse'
          description: The page_token is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
          description: Container error schema for authorization errors.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
          description: Container error schema for forbidden errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
          description: Container error schema for not found errors.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponse'
          description: Container error schema for rate-limiting errors.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
          description: Container error schema for internal errors.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
          description: Container error schema for service unavailable errors.
      summary: Get all contacts
      tags:
        - Contacts
  /api/v4/consumer-contacts/:
    get:
      description: >-
        Get all the contacts filtered by user and alias, taxonomy, id or
        currency (all optional).
      operationId: searchContactsPaged-1
