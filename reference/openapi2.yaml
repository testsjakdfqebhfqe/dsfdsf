components:
  schemas:
    ApiKeyDisabledError:
      description: >-
        Disabled API key error schema. Indicates the API key used to sign the
        request is disabled.
      properties:
        code:
          type: string
          default: api_key_disabled
          description: Error code.
          example: api_key_disabled
        message:
          type: string
          default: The API key used to sign the request is disabled.
          description: Error message.
          example: The API key used to sign the request is disabled.
    ApiKeyInvalidFormatError:
      description: >-
        Invalid API format key error schema. Indicates the API key used to sign
        the request has an invalid format.
      properties:
        code:
          type: string
          default: api_key_invalid_format
          description: Error code.
          example: api_key_invalid_format
        message:
          type: string
          default: >-
            The API key used to sign the request has an invalid format. The API
            key should contain only letters and numbers, and its length must be
            10.
          description: Error message.
          example: >-
            The API key used to sign the request has an invalid format. The API
            key should contain only letters and numbers, and its length must be
            10.
    ApiKeyNotFoundError:
      description: >-
        Invalid API key not found error schema. Indicates the API key used to
        sign the request was not found.
      properties:
        code:
          type: string
          default: api_key_not_found
          description: Error code.
          example: api_key_not_found
        message:
          type: string
          default: The API key used to sign the request was not found.
          description: Error message.
          example: The API key used to sign the request was not found.
    BadRequestErrorResponse:
      description: Container error schema for bad request errors.
      properties:
        errors:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/InvalidFieldError'
              - $ref: '#/components/schemas/UnparseableInputError'
              - $ref: '#/components/schemas/MissingParameterError'
            description: Bad request error schema.
          minItems: 1
          uniqueItems: true
    Beneficiary:
      type: object
      description: Beneficiary of a travel-rule-covered transaction.
      example:
        name: Jane Doe
        type: NATURAL
      properties:
        name:
          type: string
          description: Name of the beneficiary.
          example: Jane Doe
        type:
          $ref: '#/components/schemas/BeneficiaryType'
          description: Whether the beneficiary is a natural person or a legal entity.
          example: NATURAL
    BeneficiaryType:
      type: string
      description: >-
        Whether the beneficiary is an individual person or a company or other
        legal entity.
      enum:
        - NATURAL
        - LEGAL
    Compliance:
      type: object
      description: >-
        Compliance declarations attached to the contact's destination. Only the
        fields relevant to the applicable compliance regimes are present.
      example:
        travel_rule:
          vasp:
            name: Example VASP
            did: did:example:123456
          beneficiary:
            name: Jane Doe
            type: NATURAL
      properties:
        travel_rule:
          $ref: '#/components/schemas/TravelRule'
          description: >-
            Travel-rule declaration, present when the contact is subject to
            travel-rule reporting.
    ComplianceType:
      type: string
      description: Compliance regime that applies to a contact's destination.
      enum:
        - TRAVEL_RULE
    Contact:
      type: object
      description: A saved withdrawal destination for the authenticated user.
      example:
        id: 12345
        alias: Jane's wallet
        taxonomy:
          network: spei
          asset: mxn
          protocol: clabe
          integration: praxis
          currency: mxn
        details:
          - name: CLABE
            key: clabe
            value: '012345678901234567'
            flags: []
        created_at: '2026-02-26T14:00:00Z'
        compliant:
          - TRAVEL_RULE
        compliance:
          travel_rule:
            vasp:
              name: Example VASP
              did: did:example:123456
            beneficiary:
              name: Jane Doe
              type: NATURAL
        flags:
          - FREQUENT
      properties:
        alias:
          type: string
          description: User-assigned name for the contact.
          example: Jane's wallet
        compliance:
          $ref: '#/components/schemas/Compliance'
          description: >-
            Compliance declarations attached to this contact's destination,
            present when compliant is non-empty.
        compliant:
          type: array
          anyOf:
            - $ref: '#/components/schemas/ComplianceType'
          description: Compliance regimes that apply to this contact's destination.
          items:
            $ref: '#/components/schemas/ComplianceType'
          uniqueItems: true
        created_at:
          type: string
          format: date-time
          description: Timestamp at which the contact was created.
          example: '2026-02-26T14:00:00Z'
        details:
          type: array
          description: Named attributes of the contact's destination.
          items:
            $ref: '#/components/schemas/ContactDetail'
        flags:
          type: array
          description: Additional flags qualifying this contact.
          items:
            type: string
        id:
          type: integer
          format: int64
          description: Unique identifier of the contact.
          example: 12345
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
          description: Rail and asset combination this contact is set up for.
      required:
        - created_at
        - id
        - taxonomy
    ContactDetail:
      type: object
      description: >-
        A single named attribute of the contact's destination, e.g. a CLABE or
        an account number.
      example:
        name: CLABE
        key: clabe
        value: '012345678901234567'
        flags: []
      properties:
        flags:
          type: array
          description: Additional flags qualifying this detail.
          items:
            type: string
        key:
          type: string
          description: Machine-readable identifier for this detail.
          example: clabe
        name:
          type: string
          description: Human-readable label for this detail.
          example: CLABE
        value:
          type: string
          description: Value of this detail.
          example: '012345678901234567'
      required:
        - key
        - name
        - value
    ContactsSearchPagedResponse:
      type: object
      description: Paginated list of the authenticated user's contacts.
      example:
        contacts:
          - id: 12345
            alias: Jane's wallet
            taxonomy:
              network: spei
              asset: mxn
              protocol: clabe
              integration: praxis
              currency: mxn
            details:
              - name: CLABE
                key: clabe
                value: '012345678901234567'
                flags: []
            created_at: '2026-02-26T14:00:00Z'
            compliant:
              - TRAVEL_RULE
            compliance:
              travel_rule:
                vasp:
                  name: Example VASP
                  did: did:example:123456
                beneficiary:
                  name: Jane Doe
                  type: NATURAL
            flags:
              - FREQUENT
        next_page_token: eyJjdXJzb3IiOiJiNjllM…
        total_count: 1
      properties:
        contacts:
          type: array
          description: Contacts matching the search filters, for the current page.
          items:
            $ref: '#/components/schemas/Contact'
        next_page_token:
          type: string
          description: Cursor for the next page. Omitted on the last page.
          example: eyJjdXJzb3IiOiJiNjllM…
        total_count:
          type: integer
          format: int64
          description: >-
            Total number of contacts matching the search filters, across all
            pages.
          example: 1
      required:
        - total_count
    ErrorDefinition:
      allOf:
        - $ref: '#/components/schemas/ServiceUnavailableError'
        - type: object
          properties:
            code:
              type: string
            message:
              type: string
      description: Service unavailable error schema.
    ForbiddenErrorResponse:
      description: Container error schema for forbidden errors.
      example:
        errors:
          - code: forbidden_request
            message: >-
              Permission denied. You do not have the required authorization to
              access this resource or perform this action.
      properties:
        errors:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ForbiddenRequestError'
              - $ref: '#/components/schemas/IpAddressNotAllowedError'
              - $ref: '#/components/schemas/SuspendedAccountError'
            description: Forbidden error schema.
          minItems: 1
          uniqueItems: true
    ForbiddenRequestError:
      description: >-
        Authorization error schema. Indicates the authenticated user lacks
        necessary permissions.
      properties:
        code:
          type: string
          default: forbidden_request
          description: Error code.
          example: forbidden_request
        message:
          type: string
          default: >-
            Permission denied. You do not have the required authorization to
            access this resource or perform this action.
          description: Error message.
          example: >-
            Permission denied. You do not have the required authorization to
            access this resource or perform this action.
    InternalError:
      description: >-
        Internal error schema. Indicates the system encountered an internal
        error.
      properties:
        code:
          type: string
          default: internal_error
          description: Error code.
          example: internal_error
        message:
          type: string
          default: Internal error.
          description: Error message.
          example: Internal error.
    InternalErrorResponse:
      description: Container error schema for internal errors.
      example:
        errors:
          - code: internal_error
            message: Internal error.
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDefinition'
          maxItems: 1
          minItems: 1
          uniqueItems: true
    InvalidFieldError:
      description: >-
        Invalid field error schema. Indicates the provided request has an
        invalid field.
      properties:
        code:
          type: string
          default: invalid_field
          description: Error code.
          example: invalid_field
        message:
          type: string
          description: Error message.
    InvalidPageTokenError:
      type: object
      description: The page_token could not be decoded or failed integrity verification.
      example:
        code: invalid_page_token
        message: The provided page_token is invalid.
      properties:
        code:
          type: string
        message:
          type: string
    IpAddressNotAllowedError:
      description: >-
        Invalid IP error schema. Indicates the IP address to access the resource
        is not allowed.
      properties:
        code:
          type: string
          default: ip_address_not_allowed
          description: Error code.
          example: ip_address_not_allowed
        message:
          type: string
          default: IP address is not allowed to access the resource.
          description: Error message.
          example: IP address is not allowed to access the resource.
    MaxAttemptsReachedError:
      description: >-
        Error indicating that the client has sent too many requests in a given
        amount of time (rate limiting).
      properties:
        code:
          type: string
          default: too_many_requests
          description: Error code.
          example: too_many_requests
        message:
          type: string
          default: Too many requests were made in the current time period.
          description: Error message.
          example: Too many requests were made in the current time period.
    MissingParameterError:
      description: >-
        Missing parameter error schema. Indicates the provided request is
        missing a required parameter.
      properties:
        code:
          type: string
          default: missing_parameter
          description: Error code.
          example: missing_parameter
        message:
          type: string
          description: Error message.
          example: sender_id parameter is missing.
    NotFoundErrorResponse:
      description: Container error schema for not found errors.
      example:
        errors:
          - code: resource_not_found
            message: Resource not found.
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDefinition'
          maxItems: 1
          minItems: 1
          uniqueItems: true
    RequestNonceAlreadyInUseError:
      description: >-
        Request nonce already in use error schema. Indicates the provided
        request nonce was already used.
      properties:
        code:
          type: string
          default: request_nonce_already_in_use
          description: Error code.
          example: request_nonce_already_in_use
        message:
          type: string
          default: The provided request nonce was already used.
          description: Error message.
          example: The provided request nonce was already used.
    RequestNonceDatetimeError:
      description: >-
        Request nonce date-time error schema. Indicates the provided request
        nonce has a invalid date-time range.
      properties:
        code:
          type: string
          default: request_nonce_date_time_error
          description: Error code.
          example: request_nonce_date_time_error
        message:
          type: string
          default: >-
            The request nonce date-time must be in the past and is valid only
            for 30 seconds.
          description: Error message.
          example: >-
            The request nonce date-time must be in the past and is valid only
            for 30 seconds.
    RequestNonceNegativeError:
      description: >-
        Request nonce negative error schema. Indicates the nonce provided for
        the request is negative value.
      properties:
        code:
          type: string
          default: request_nonce_negative
          description: Error code.
