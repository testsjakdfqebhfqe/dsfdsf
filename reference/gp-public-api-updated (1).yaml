openapi: 3.0.0
x-stoplight:
  id: fkvzqqpxw96e9
info:
  version: 1.0.0
  title: Airbase Guided Procurement External API
  description: >-
    ## Guided Procurement API


    The Guided Procurement API provides endpoints to retrieve information about
    GP requests and milestones, as well as to approve or deny milestones.


    ### Authentication


    An access token can be generated from the Airbase web app by going to
    **Settings > Connections > Tokens & Webhooks**.


    Notes:


    - All the datetime fields are presented in ISO format means that the date
    and time values are formatted according to the ISO 8601 standard.
servers:
  - url: https://api.airbase.io
paths:
  /v1/intake/{intake_id}/:
    get:
      tags:
        - Guided Procurement Request
      summary: Guided Procurement Request Details
      description: >-
        This endpoint provides primary information about the guided procurement
        request and its milestones.

        Note:


        - The `milestone` data is structured as a 2D array that depicts the
        hierarchy of milestones from the top level to the bottom level.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            example: Token {{access_token}}
          examples:
            default:
              value: Token {{access_token}}
        - name: intake_id
          in: path
          required: true
          schema:
            type: string
            example: 85056f14-dbc1-40ad-bb65-b43637f26d7a
          examples:
            default:
              value: 85056f14-dbc1-40ad-bb65-b43637f26d7a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailIntakeRequest'
              examples:
                default:
                  value:
                    id: 85056f14-dbc1-40ad-bb65-b43637f26d7a
                    created_date: '2023-04-11T10:21:38.891440'
                    request_workflow_type: INTAKE
                    spend_mode: purchase order
                    status: created
                    primary_category: Software Subscription
                    secondary_category: Marketing tools
                    requested_amount: 123400
                    requested_amount_currency: USD
                    request_url: >-
                      https://dashboard.airbase.io/requests/intake-requests/created/1234/summary/
                    vendor:
                      name: GitHub
                      description: >-
                        GitHub provides code hosting services that allow
                        developers to build software for open-source and private
                        projects in organizations.
                      website: github.com
                      vendor_type: existing_vendor
                    requester:
                      first_name: John
                      last_name: Doe
                      email: john.doe@example.io
                    milestones:
                      - - id: 4a7c3244-db10-4bfd-b45a-5c5e4091d6a9
                          created_date: '2023-04-11T10:21:40.815000'
                          name: Department Approval
                          status: created
                      - - id: 594ddf38-e358-4ead-829a-ca3986e3930b
                          created_date: '2023-04-11T10:21:39.418673'
                          name: Legal Review
                          status: created
                        - id: 83ca521e-1ee1-43c4-9c3f-d0a8c83d88cf
                          created_date: '2023-04-11T10:21:39.952990'
                          name: IT Approval
                          status: created
                        - id: ece32f52-932a-40ab-8159-b075dd3c36cf
                          created_date: '2023-04-11T10:21:40.381401'
                          name: Software and Services Procurement Approval
                          status: created
                      - - id: db7ffc8c-6302-4624-a4aa-76f9aeb2ed09
                          created_date: '2023-04-11T10:21:39.109791'
                          name: Finance & Accounting Approval
                          status: created
                    request_files:
                      - name: sample_file_name.pdf
                        upload: https://airbase..com/company_XXXXXX/XXXXXXXX
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
      servers:
        - url: https://api.airbase.io
      x-stoplight:
        id: 6goz0s2rn0sco
  /v1/intake/{intake_id}/upload_file/:
    post:
      summary: Upload File To Guided Procurement Request
      description: >-
        This endpoint allows users to upload files to a guided procurement
        request.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            example: Token {{access_token}}
          examples:
            default:
              value: Token {{access_token}}
        - name: intake_id
          in: path
          required: true
          schema:
            type: string
            example: 85056f14-dbc1-40ad-bb65-b43637f26d7a
          examples:
            default:
              value: 85056f14-dbc1-40ad-bb65-b43637f26d7a
      tags:
        - Guided Procurement Request
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestFile'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestFileResponse'
              examples:
                default:
                  value:
                    status: success
                    message: File uploaded successfully
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestFileResponse'
              examples:
                default:
                  value:
                    status: failed
                    message: Failed to upload file due to an internal error
          description: ''
      x-stoplight:
        id: gty1mlqx6dbj6
