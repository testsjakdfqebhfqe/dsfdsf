  /v1/milestone/{milestone_id}/approve/:
    patch:
      tags:
        - Guided Procurement Milestone
      summary: Approve Milestone
      description: >-
        This endpoint allows an approver to approve a specific milestone in a
        guided procurement request.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            example: Token {{access_token}}
          examples:
            default:
              value: Token {{access_token}}
        - name: milestone_id
          in: path
          required: true
          schema:
            type: string
            example: 4a7c3244-db10-4bfd-b45a-5c5e4091d6a9
          examples:
            default:
              value: 4a7c3244-db10-4bfd-b45a-5c5e4091d6a9
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneApproveDenyRequest'
            examples:
              default:
                value:
                  approver_email: john.doe@example.io
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneApproveDenyResponse'
              examples:
                default:
                  value:
                    status: success
                    message: >-
                      Approved milestone_id:
                      4a7c3244-db10-4bfd-b45a-5c5e4091d6a9
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
      servers:
        - url: https://api.airbase.io
      x-stoplight:
        id: bz5x3ebn07f3z
