components:
  schemas:
    DetailIntakeRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        request_workflow_type:
          $ref: '#/components/schemas/MilestoneWorkflowType'
        spend_mode:
          $ref: '#/components/schemas/SpendModeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        primary_category:
          type: string
          readOnly: true
        secondary_category:
          type: string
          readOnly: true
        request_url:
          type: string
          readOnly: true
        requested_amount:
          type: number
          format: double
          readOnly: true
        requested_amount_currency:
          type: string
          description: ISO 4217 code. Example `USD, GBP`
          readOnly: true
        vendor:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/VendorData'
        description:
          type: string
          readOnly: true
        requester:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BaseUser'
        custom_sections:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/CustomSection'
        milestones:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/BasicMilestone'
        request_files:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/FileStructure'
      required:
        - id
        - created_date
        - spend_mode
        - status
        - primary_category
        - secondary_category
        - requested_amount
        - requested_amount_currency
        - request_url
        - vendor
        - description
        - requester
        - custom_sections
        - milestones
        - request_files
      x-stoplight:
        id: dthr4cko3ov4w
    MilestoneWorkflowType:
      type: string
      enum:
        - INTAKE
        - RENEWAL
        - VENDOR_APPROVAL
        - CUSTOM
      x-stoplight:
        id: f74nf53c8am72
    SpendModeEnum:
      type: string
      enum:
        - one-time virtual card
        - recurring virtual card
        - purchase order
      description: |-
        * `one-time virtual card` - one-time virtual card
        * `recurring virtual card` - recurring virtual card
        * `purchase order` - purchase order
      x-stoplight:
        id: tve5v2xuevgxs
    StatusEnum:
      type: string
      enum:
        - draft
        - created
        - accepted
        - rejected
        - archived
      x-stoplight:
        id: z6afcscirmdm5
    VendorData:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        website:
          type: string
          format: uri
          readOnly: true
        vendor_type:
          $ref: '#/components/schemas/VendorTypeEnum'
      required:
        - name
        - description
        - website
        - vendor_type
      x-stoplight:
        id: h13eibxqy1203
