              schema:
                $ref: '#/components/schemas/ConstraintViolationList'
        '429':
          description: Too many requests
      summary: Updates the AutomationRule resource.
      description: Updates the AutomationRule resource.
      parameters:
        - name: id
          in: path
          description: Automation rule ID.
          required: true
          deprecated: false
          schema:
