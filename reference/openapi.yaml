      summary: Retrieves the collection of AutomationRule resources.
      description: Retrieves the collection of AutomationRule resources.
      parameters:
        - name: triggerType
          in: query
          description: Filter by trigger type
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: string
            enum:
              - tag_added
              - tag_removed
              - form_subscribed
          style: form
          explode: false
          allowReserved: false
        - name: triggerTagId
          in: query
          description: >-
            Filter by trigger tag ID; requires "triggerType" to be "tag_added"
            or "tag_removed"
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: integer
          style: form
          explode: false
          allowReserved: false
        - name: triggerFunnelStepId
          in: query
          description: >-
            Filter by trigger funnel step ID; requires "triggerType" to be
            "form_subscribed"
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: integer
          style: form
          explode: false
          allowReserved: false
        - name: actionType
          in: query
          description: Filter by action type
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: string
            enum:
              - add_tag
              - remove_tag
          style: form
          explode: false
          allowReserved: false
        - name: actionTagId
          in: query
          description: >-
            Filter by action tag ID; requires "actionType" to be "add_tag" or
            "remove_tag"
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: integer
          style: form
          explode: false
          allowReserved: false
        - name: active
          in: query
          description: Filter by active state
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: boolean
          style: form
          explode: false
          allowReserved: false
        - name: limit
          in: query
          description: Cursor-based pagination limit
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
          style: form
          explode: false
          allowReserved: false
        - name: startingAfter
          in: query
          description: >-
            Cursor for fetching the next page. Omit this field when requesting
            the first page. When `hasMore` is true, set it to the positive `id`
            of the last item returned on the previous page and keep the same
            `order`. Never use `0` or guess a value.
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: integer
          style: form
          explode: false
          allowReserved: false
        - name: order
          in: query
          description: Cursor-based pagination initial ordering
          required: false
          deprecated: false
          allowEmptyValue: false
          schema:
            type: string
            enum:
              - asc
              - desc
          style: form
          explode: false
          allowReserved: false
      deprecated: false
      x-systeme-mcp-tool-name: get_automation_rules
    post:
