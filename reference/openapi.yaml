openapi: 3.0.1
info:
  title: Auth
  description: >-
    # API de Integração Hotcred


    Bem-vindo à documentação oficial da API de Integração da **Hotcred** para
    parceiros, securitizadoras e correspondentes bancários.


    ---


    ### 📁 Estrutura da Documentação:

    1. **Autenticação**: Gestão de credenciais OAuth2 do Corban e login seguro
    do operador via API Key + credenciais com emissão de token JWT Passport
    (`integration-access`).

    2. **Metadados**: Catálogo de convênios autorizados e tabelas de taxas, TAC
    e prazos.

    3. **Simulação**: Disparo assíncrono de cálculos e consulta consolidada via
    REST.

    4. **Hasura**: Consultas e subscrições em tempo real via GraphQL (HTTP e
    WebSocket) com isolamento por Corban.

    5. **Webhook**: Notificação assíncrona recebida quando os cálculos são
    concluídos pelo microserviço.


    ---


    ### 🔑 Credenciais Pré-Configuradas de Teste (Homologação - Corban 91):

    * **Corban ID**: `91` (*MP Techs - Teste* | CNPJ: `13.935.893/0001-09`)

    * **API Key**:
    `ak_`

    * **Operador**: `operador91@hotcred.com.br`

    * **Senha**: `Hotcred@2026!`

    * **Hasura HTTP**: `https://hgraphql.hotcred.com.br/v1/graphql`

    * **Hasura WebSocket**: `wss://hgraphql.hotcred.com.br/v1/graphql`
  version: 1.0.0
tags:
  - name: Auth
  - name: autenticacao
paths:
  /auth/login:
    post:
      summary: Autenticação API
      deprecated: false
      description: >-
        <Tabs>   <Tab title="Tab 1">     test   </Tab>    <Tab title="Tab
        2">     test   </Tab> </Tabs>
      tags:
        - Auth
        - autenticacao
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: '{{login}}'
              password: '{{password}}'
        required: true
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers: {}
        '401':
          description: Credenciais inválidas ou API Key não informada
          headers: {}
        '403':
          description: Usuário inativo ou não pertencente ao Corban autorizado
          headers: {}
      security:
        - ApiKeyAuth1: []
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Email ou CPF do operador
          example: operador@suaempresa.com.br
        password:
          type: string
          format: password
          description: Senha do operador
          example: SuaSenhaSegura@123
    LoginResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        token:
          type: string
          description: Token JWT Passport para uso como Bearer token e autenticação Hasura
          example: >-
            eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2hhcGkuaG90Y3JlZC5jb20uYnIvYXBpIiwiYXVkIjoiaG90Y3JlZC1oYXN1cmEiLCJleHAiOjE3NTk4NDg0MDB9.exemploAssinaturaJWT
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 1200
        user:
          type: object
          properties:
            id:
              type: integer
              example: 501
            name:
              type: string
              example: Nome do Operador
            email:
              type: string
              example: operador@suaempresa.com.br
            id_corban:
              type: integer
              example: 100
        corban:
          type: object
          properties:
            id:
              type: integer
              example: 100
            nome:
              type: string
              example: Sua Empresa Correspondente
            razao_social:
              type: string
              example: Sua Empresa Correspondente Bancário LTDA
            cnpj:
              type: string
              example: '00000000000100'
        hasura:
          type: object
          properties:
            endpoint:
              type: string
              example: https://hgraphql.hotcred.com.br/v1/graphql
            ws_endpoint:
              type: string
              example: wss://hgraphql.hotcred.com.br/v1/graphql
  responses: {}
  securitySchemes:
    ApiKeyAuth1:
      type: apiKey
      in: header
      name: X-API-KEY
      description: >-
        Chave de integração do correspondente/securitizadora fornecida pela
        Hotcred
servers:
  - url: https://hapi.hotcred.com.br/api/integracao
    description: docs
security: []
