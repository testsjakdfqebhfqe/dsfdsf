            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolationList'
        '429':
          description: Too many requests
      summary: Creates a AutomationRule resource.
      description: Creates a AutomationRule resource.
      parameters: []
      requestBody:
        description: The new AutomationRule resource
        content:
