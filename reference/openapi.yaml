openapi: 3.0.3
info:
  title: Saner Platform
  version: 1.0.0
  description: |
    Saner Platform

    Each OpenAPI file documents exactly one endpoint.
  license:
    name: Proprietary
    url: https://www.secpod.com/terms-and-conditions/
servers:
  - url: https://saner.secpod.com
    description: Default
security:
  - apiKeyAuth: []
paths:
  /AncorWebService/perform:
    post:
      tags:
        - Organization Management
      summary: Add Organization
      operationId: addOrganization
      description: >
        This method allows you to add organizations in Saner Server. An
        organization needs a unique name, email address, end (expiry) date, and
        number of subscriptions. The value will be set to the administrator’s
        end date if you do not provide one. Please ensure that the value end
        date does not exceed the value of your administrator’s end date.


        | Key                  |
        Meaning                                                                
        | Mandatory | Data Type |

        |----------------------|-------------------------------------------------------------------------|-----------|----------|

        | name                 | Organization unique
        name.                                               | Yes       |
        string   |

        | email                | Organization email
        address.                                             | Yes       |
        string   |

        | numberofsubscriptions| Number of subscriptions to be allocated
        (expected integer).             | Yes       | string   |

        | enddate              | Organization end (expiry) date in format
        yyyy-mm-dd.                    | No       | string   |
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
      security:
        - apiKeyAuth: []
      x-readme:
        code-samples:
          - language: python
            name: Python SDK
            install: pip install secpod-saner-sdk
            code: |
              from saner.platform import PlatformClient

              client = PlatformClient(
                  api_key="<YOUR_API_KEY>",
                  accountid="<YOUR_ACCOUNT_ID>",
                  base_url="https://saner.secpod.com"
              )

              response = client.Organization.add(
                  name="OrgName",
                  email="demo@email.com",
                  numberofsubscriptions="100"
              )

              print(response)
              client.close()
          - language: python
            name: Python (Raw HTTP)
            code: |
              # To use the Try It section, choose another language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    request:
                      type: object
                      properties:
                        method:
                          type: string
                          example: addOrganization
                        parameters:
                          type: object
                          properties:
                            parameterset:
                              type: array
                              items:
                                type: object
                                properties:
                                  parameter:
                                    type: array
                                    items:
                                      allOf:
                                        - type: object
                                          properties:
                                            key:
                                              type: string
                                              enum:
                                                - name
                                                - email
                                                - numberofsubscriptions
                                                - enddate
                                            value:
                                              type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      method:
                        type: string
                      results:
                        type: object
                        properties:
                          result:
                            type: array
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                status:
                                  type: string
                                reason:
                                  type: string
              examples:
                Success:
                  summary: Organization added successfully
                  value:
                    response:
                      method: addOrganization
                      results:
                        result:
                          - key: testorganization1
                            status: success
                            reason: ''
        '400':
          description: Possible errors (plain text messages)
          content:
            application/json:
              schema:
                type: string
              examples:
                OrganizationNotCreated:
                  summary: Organization not created
                  value: Organization not created.
                NameMinLength:
                  summary: Organization name too short
                  value: Organization name must be of minimum 4 characters.
                InvalidOrganizationName:
                  summary: Invalid organization name
                  value: >-
                    Invalid organization name. Only alphanumeric characters and
                    -, _, . are allowed.
                InvalidEmail:
                  summary: Invalid email
                  value: Failed due to invalid email.
                InvalidSubscriptionCount:
                  summary: Invalid subscription count
                  value: >-
                    Failed due to invalid subscription count (expected integer
                    and should not exceed maximum available subscription count)
                InvalidExpiryDate:
                  summary: Invalid expiry date
                  value: >-
                    Failed due to invalid expiry date (expected format
                    yyyy-mm-dd and should not exceed your license validity)
                NoRecordsFound:
                  summary: No records found with given name
                  value: No records found with given name.
                FieldCannotBeEmpty:
                  summary: Field cannot be empty
                  value: Field <key> cannot be empty.
                SubscriptionGreaterThanZero:
                  summary: Subscription value should be greater than zero
                  value: Subscription value should be greater than zero.
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Get your API key- https://example.com
  parameters:
    AccountIdQuery:
      name: accountid
      in: query
      required: true
      description: Account name used to identify the User
      schema:
        type: string
      example: Default
