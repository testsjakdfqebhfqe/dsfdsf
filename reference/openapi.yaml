            - h4

            - ul

            - ol

            - figure


            Plain text must be wrapped in a paragraph.


            Allowed inline tags:

            - span

            - strong

            - em

            - u

            - s

            - a

            - br


            Text blocks:

            - Use p, h2, h3, or h4.

            - Use inline style for paragraph spacing, indentation, alignment,
            and line height when needed.

            - Every paragraph must explicitly use one spacing style:
              - margin-top: 0; margin-bottom: 0 for no extra spacing
              - margin-top: 1rem; margin-bottom: 1rem for extra spacing
            - Empty lines should be <p></p> or <p><br></p>.

            - Use br for line breaks inside a text block.


