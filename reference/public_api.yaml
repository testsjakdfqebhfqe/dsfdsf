  /v1/vendors/:
    get:
      operationId: List All Vendors
      description: >-
        Retrieve a paginated list of vendors for the authenticated company.


        Vendors with a public status of `active`, `inactive`, `pending`, or
        `merged`

        are returned. Vendors in `draft`, `denied`, or `deleted` state are
        excluded.


        Each record is a slimmer version of the `GET /v1/vendors/{id}` response
        — it

        omits contact, address, tax, and payment details; fetch a vendor by ID
        for those.


        Results are ordered by creation date, newest first, for stable
        pagination.


        ### Query Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `page` | integer | No | Page number, 1-indexed (default: 1) |

        | `page_size` | integer | No | Number of records per page (default: 250,
        max: 1000) |


        ---


        ## Response Field Reference


        | Field | Type | Description |

        | --- | --- | --- |

        | `id` | uuid | Vendor ID |

        | `name` | string | Vendor display name |

        | `vendor_status` | enum | Public vendor status: `active`, `inactive`,
        `pending`, or `merged` |

        | `vendor_type` | enum | Vendor classification: `company` or
        `individual` |

        | `primary_email` | string / null | Primary contact email |

        | `preferred_currency` | string / null | Preferred invoice currency as
        an ISO 4217 code (e.g. `USD`) |

        | `preferred_country` | string | Preferred country as an ISO 3166-1
        alpha-2 code (e.g. `US`) |

        | `created_at` | string (date-time) | When the vendor was created |

        | `updated_at` | string (date-time) | When the vendor was last modified
        |


        All timestamps are UTC ISO 8601.


        ---


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — paginated array of vendors |

        | 401 | Unauthorized — missing or invalid token |

        | 403 | Forbidden — Vendor Management API not enabled for this company |

        | 405 | Method not allowed — only `GET` is supported on this endpoint |

        | 429 | Rate limit exceeded |
      summary: List Vendors
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - Vendor Management
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVendorListList'
              examples:
                ListVendorsResponse:
                  value:
                    data:
                      - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        name: Acme Inc.
                        vendor_status: active
                        vendor_type: company
                        primary_email: ap@acme.com
                        preferred_currency: USD
                        preferred_country: US
                        created_at: '2026-01-12T10:00:00Z'
                        updated_at: '2026-05-22T14:33:00Z'
                      - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                        name: GlobalTech Solutions
                        vendor_status: merged
                        vendor_type: company
                        primary_email: billing@globaltech.io
                        preferred_currency: EUR
                        preferred_country: DE
                        created_at: '2025-11-03T08:15:00Z'
                        updated_at: '2026-06-01T11:22:00Z'
                    pagination:
                      next: https://api.airbase.io/v1/vendors/?page=2&page_size=250
                      previous: null
                      page: 1
                      page_size: 250
                  summary: Paginated vendor list
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAPIError'
              examples:
                401—Unauthorized:
                  value:
                    error_code: 407107
                    error_message: unauthorized
                  summary: Missing or invalid authentication credentials.
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAPIError'
              examples:
                403—AccessNotEnabled:
                  value:
                    error_code: 407108
                    error_message: forbidden
                  summary: Vendor Management API is not enabled for this company.
          description: ''
        '405':
          content:
