        | `subsidiary_id` | uuid | No | Return only cards belonging to this
        subsidiary |

        | `vendor_id` | uuid | No | Return only cards assigned to this vendor |

        | `page` | integer | No | Page number (default: 1) |

        | `page_size` | integer | No | Results per page (default: 250, max:
