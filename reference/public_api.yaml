        ---


        ## Computing the Closing Balance


        > **Key concept:** The list endpoint returns only transactions that had
        a **balance impact in the requested month**. It does **not** carry
        forward pending transactions from previous months. A transaction that
        went pending in January and is still pending in February will appear in
        the January response but **not** in February (unless it had a new impact
        in February). Track pending transactions across months yourself.


        ### Step 1 — Fetch All Transactions for the Month


        Page through the full result set, following `pagination.next` until it
        is `null`:


        ### Step 2 — Compute the Closing Settled Balance


        Filter to `is_real_time_sync = false` and `status` in `{settled,
        declined}`, then sum `amount`:


        ### Step 3 — Compute the Closing Pending Balance


        Accumulate pending state across months:

        1. Start from the first month; fetch transactions sequentially.

        2. Maintain a running set of pending transactions (keyed by
        `transaction_id`).

        3. Each month: **add** new `created`/`pending` transactions (with
        `is_real_time_sync = false`); **remove** any that now appear as
        `settled` or `declined`.

        4. Closing pending balance = sum of `amount` for all transactions still
        in the pending set.


        ### Step 4 — Filter by Payment Product (Optional)


        Pass `payment_product` (see filter values above) to compute
        product-specific balances, then apply Steps 1–3 on the filtered result
        set.


        ---


        ## Worked Example


        ### Starting State — Subsidiary 42, Opening balances January 2025


        - Opening settled balance: **$10,000.00**

        - Opening pending balance: **$0.00**

        - Pending transaction set: empty


        ### Month 1: January 2025


        | Transaction ID | Status | `amount` | `is_real_time_sync` |

        | --- | --- | --- | --- |

        | 1001 | settled | −500.00 | false |

        | 1002 | settled | −1,200.00 | false |

        | 1003 | pending | −300.00 | false |

        | 1004 | settled | −800.00 | true |

        | 1005 | pending | −150.00 | false |


        **Closing Settled Balance:**


        > Transaction 1004 has `is_real_time_sync = true` — excluded from
        settled balance.


        **Closing Pending Balance:**


        ### Month 2: February 2025


        | Transaction ID | Status | `amount` | `is_real_time_sync` |

        | --- | --- | --- | --- |

        | 1003 | settled | −280.00 | false |

        | 1006 | settled | −900.00 | false |

        | 1007 | pending | −400.00 | false |


        **Closing Settled Balance:**


        **Closing Pending Balance:**


        ### Month 3: March 2025


        | Transaction ID | Status | `amount` | `is_real_time_sync` |

        | --- | --- | --- | --- |

        | 1005 | settled | −150.00 | false |

        | 1007 | declined | 0.00 | false |

        | 1008 | settled | −600.00 | false |


        **Closing Settled Balance:**


        **Closing Pending Balance:** $0.00


        ### Month 4: April 2025 — Settlement Adjustment


        When TXN 1008's settled amount changes, the API produces two records in
        the same month:


        | Transaction ID | Status | `amount` | Note |

        | --- | --- | --- | --- |

        | 1008 | settled | +600.00 | Reversal of the March settlement |

        | 1008 | settled | −800.00 | New settled amount |

        | 1009 | settled | −350.00 | New transaction, settled immediately |


        **Closing Settled Balance:**


        ### Summary


        | Month | Opening Settled | Settled Delta | Closing Settled | Closing
        Pending |

        | --- | --- | --- | --- | --- |

        | Jan 2025 | $10,000.00 | −$1,700.00 | $8,300.00 | −$450.00 |

        | Feb 2025 | $8,300.00 | −$1,180.00 | $7,120.00 | −$550.00 |

        | Mar 2025 | $7,120.00 | −$750.00 | $6,370.00 | $0.00 |

        | Apr 2025 | $6,370.00 | −$550.00 | $5,820.00 | $0.00 |


        ---


        ## FAQ


        **Q: Do I need to paginate?**

        A: Yes. Default page size is 250 (max 1,000). Check `pagination.next` —
        if non-null, fetch it to get the next page; keep going until it is
        `null`.


        **Q: What does a positive `amount` mean?**

        A: Money flowing **into** the subsidiary's balance (e.g. wallet loads,
        refunds, cashback, chargebacks, reversal of a prior settlement).


        **Q: What does a negative `amount` mean?**

        A: Money flowing **out of** the subsidiary's balance (e.g. card
        payments, bill payments, reimbursements, fees).


        **Q: Are balances for the current ongoing month final?**

        A: No. Always refetch the entire current month for the latest data. Past
        months are stable.


        **Q: How do I get the opening settled balance for the first month?**

        A: The API does not return opening balances directly. Obtain the initial
        opening balance from the platform balance report export or contact
        platform support.


        **Q: Should I include `is_real_time_sync = true` transactions when
        computing the closing balance?**

        A: No. RT Sync transactions do not contribute to either the Closing
        Settled Balance or Closing Pending Balance.


        **Q: A transaction appears twice in the same month with the same status.
        Is this a bug?**

        A: No. When a transaction's settled amount changes, it produces a
        reversal of the prior amount and the new amount. Sum both records for
        the net impact.


        **Q: What is the difference between `amount` and
        `transaction_currency_amount`?**

        A: `amount` is in the subsidiary's base currency (used for balance
        computation). `transaction_currency_amount` is in the original
        transaction currency. For domestic transactions these are the same.


