          readOnly: true
          description: >-
            Trailing digits of the card number (e.g. `4242`). The count varies
            by card provider — four digits for most, five for American Express.
            `null` when the card number is not yet known.
        card_currency_data:
          allOf:
            - $ref: '#/components/schemas/CardCurrencyData'
