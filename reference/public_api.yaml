openapi: 3.0.3
info:
  title: Paylocity For Finance API Documentation
  version: 1.0.0
  description: >-
    # Paylocity for Finance Public API


    The Paylocity for Finance Public API provides programmatic access to the
    Paylocity for Finance platform. This collection contains the core APIs that
    enable a fully functional integration between your ERP and Paylocity for
    Finance, covering the essential endpoints and behaviors required for a
    successful end-to-end implementation.


    ## Paylocity for Finance-ERP Integration Model


    Paylocity for Finance follows a **bidirectional integration framework** with
    ERP systems. The integration consists of two primary data flows: ERP master
    data ingestion and ledger entry synchronisation. Together, these ensure that
    Paylocity for Finance's spend workflows remain aligned with the ERP's
    accounting structure and that all financial activity in Paylocity for
    Finance is accurately reflected in the general ledger.


    - **ERP Master Data Ingestion** — Paylocity for Finance receives master data
    from the ERP using the ERP's object APIs, including currencies,
    subsidiaries, accounts, financial dimensions, vendors, and employees. This
    data is used throughout the spend lifecycle to classify requests, enforce
    policies and approvals, and ensure transactions align with the ERP's
    accounting structure.


    - **Ledger Entry Generation and Sync** — For every approved financial
    activity in Paylocity for Finance, such as bill payments, reimbursements,
    and card transactions, Paylocity for Finance generates ledger entries that
    capture the full accounting impact. These ledger entries are exposed through
    the Ledger Entry Sync APIs.


    ______________________________________________________________________


    ## Authentication


    All API requests require a token in the `Authorization` header:


    ```

    Authorization: Token <key>:<secret>

    ```


    Generate API tokens in the Paylocity for Finance web app under **Settings →
    Connections → Tokens & Webhooks**. Each API request must include this token
    to authenticate with the Paylocity for Finance API. Once generated, copy the
    token and store it securely — it cannot be viewed again after you close the
    screen.


    ## Rate Limits


    All endpoints are subject to a rate limit that applies across all Paylocity
    for Finance APIs — not just the ERP Objects APIs. When the limit is
    exceeded, the API returns `429 Too Many Requests`. The response includes
    `X-RateLimit-Limit` (your per-minute limit) and `X-RateLimit-Remaining`
    (requests remaining in the current window) headers. This limit may be
    adjusted during onboarding once we understand the expected GL data
    throughput.


    ______________________________________________________________________


    ## Quickstart Guide


    This guide walks you through the essential steps to prepare your environment
    and make your first API call.


    **1 — Obtain a Paylocity for Finance sandbox account**


    - Request a sandbox account by contacting
    [ab-api@paylocity.com](mailto:ab-api@paylocity.com).

    - A sandbox account is recommended for safely experimenting with API calls
    without affecting production data.


    **2 — Generate access tokens**


    - Go to **Settings → Connections → Tokens & Webhooks** and click **Generate
    Access Token**.

    - Provide a name and expiry date, then click **Generate**.

    - Copy and securely store the token. It cannot be viewed again once the
    screen is closed.


    **3 — Get a copy of the API collection**


    - If testing in Postman, request a fork of the collection and add it to your
    internal workspace.

    - If testing outside Postman, export the collection and import it into your
    preferred API client.


    **4 — Configure your API client (optional)**


    Set the following variables:


    | Variable       |
    Value                                                                            
    |

    | -------------- |
    ---------------------------------------------------------------------------------
    |

    | `access_token` | Your Paylocity for Finance access token (format: `Token
    abc123xyz`)               |

    | `baseUrl`      | `https://api-stage.airbase.io` (sandbox) or
    `https://api.airbase.io` (production) |


    Set authentication at the parent level by configuring **Auth Type** to **API
    Key**.


    **5 — Begin interacting with the API**


    - **ERP Master Data Ingestion** — Start making CRUD requests against the ERP
    objects APIs: Accounts, Currencies, Employees, Subsidiaries, Tags, Vendors.
    These endpoints synchronise ERP master data with Paylocity for Finance.

    - **Ledger Entry Retrieval** — Ledger Entry GET endpoints only return data
    when transactions exist in Paylocity for Finance **and** their corresponding
    ledger entries are marked **ready for sync**. In the API, this is the
    `SYNC_READY` status. If no entries meet this condition, the endpoint returns
    an empty result.


    ______________________________________________________________________


    ## Building a Paylocity for Finance-ERP Integration


    This guide provides a detailed, end-to-end overview of the workflow required
    to build a complete integration. It covers how to establish the connection,
    sync ERP master data, process transactions, retrieve ledger entries, and
    manage the full sync lifecycle.


    ### Step 1 — Connect Paylocity for Finance to the ERP during onboarding


    - The integration is initially configured by the customer during their
    onboarding phase.

    - An access token is generated in the Paylocity for Finance web app as part
    of this process.

    - The token is stored in the ERP and used to authorise API communication
    between the two systems.


    ### Step 2 — Push all ERP master data using POST API calls


    - Before any additional configuration, ERP master data must be pushed into
    Paylocity for Finance using the ERP master data APIs. This includes
    **accounts**, **subsidiaries**, **currencies**, **tags**, **vendors**, and
    **employees**.

    - This step is mandatory and must be completed before transaction workflows
    can begin in Paylocity for Finance.

    - To keep ERP master data in sync, we recommend running a **scheduled job
    every 24 hours**. Keeping this up to date reduces sync errors and ensures
    accurate accounting downstream.


    #### Sync Sessions


    A **sync session** tracks the progress of an ERP master data push. Wrapping
    your entity sync in a session allows Paylocity for Finance to accurately
    reflect which entities have been synced and to surface the sync status in
    the UI.


    **Lifecycle:**


    1. **Start a session** — Call `POST /v1/accounting/entity/sync` with `{
    "action": "START" }` before pushing any entity data. This creates a new
    session in the `IN_PROGRESS` state and returns a `session_id`. Starting a
    new session automatically cancels any previously active session.

    2. **Push entity data** — Use the ERP master data APIs to push accounts,
    subsidiaries, currencies, tags, vendors, and employees as normal.

    3. **Complete the session** — Once all entity data has been pushed, call
    `PATCH /v1/accounting/entity/sync` with `{ "action": "COMPLETE" }`. This
    transitions the session to the `COMPLETE` state.

    4. **Check session status** — At any point, call `GET
    /v1/accounting/entity/sync/` to retrieve the current session status.


    **Session states:**


    | State               | Description                         |

    | ------------------- | ----------------------------------- |

    | `IN_PROGRESS`       | A sync is currently underway.       |

    | `COMPLETE`          | The session completed successfully. |

    | `NO_ACTIVE_SESSION` | No session is currently active.     |


    **Notes:**


    - Sessions expire after **60 minutes** if not completed. Always call the
    complete endpoint once your entity push finishes.

    - Only one session can be active per company at a time. Starting a new
    session will override any existing in-progress session.


    ### Step 3 — Configure GL account mappings in Paylocity for Finance


    - After master data is synced, the user completes the integration setup
    workflow in the Paylocity for Finance web app. This involves selecting the
    appropriate GL accounts to be used in spend workflows and transaction
    categorisations.

    - These mappings can be viewed and updated at any time after onboarding.


    ### Step 4 — Begin processing transactions in Paylocity for Finance


    - Once onboarding and ERP integration is complete, users can operate
    Paylocity for Finance to create spend requests, make card payments, submit
    expense reports, and process vendor bills and payments.

    - For every completed and approved transaction, Paylocity for Finance
    automatically generates ledger entries representing the full accounting
    impact. These entries appear in the accounting area of the product, where
    they can be reviewed by an accountant before syncing.


    ### Step 5 — Retrieve ledger entries


    - After ledger entries are reviewed, the user initiates a sync in the
    Paylocity for Finance web app. This moves entries into the `SYNC_READY`
    state, making them available via the **Ledger Entries GET API**.

    - Alternatively, subscribe to a webhook that fires automatically when
    entries transition to `sync_ready`. This allows your ERP to post entries to
    the general ledger more promptly.

    - Each ledger entry includes, at minimum: transaction date, amount,
    accounts, tags, subsidiary, and vendor — enabling the ERP to reconstruct the
    full accounting impact.

    - Only entries with `status=SYNC_READY` are returned through the GET
    endpoint. This ensures data efficiency and prevents redundant transfers.


    ### Step 6 — Save sync results back to Paylocity for Finance


    - After posting entries to the ERP's general ledger, call the **Ledger
    Entries PATCH API** to record the outcome:
      - `sync_complete` — entry synced successfully
      - `sync_error` — sync failed with an error
    - Recording the sync result updates the entry's state within Paylocity for
    Finance and provides users with visibility into its sync lifecycle.


    ### Step 7 — Manage ledger entry visibility based on sync status


    Paylocity for Finance displays ledger entries in different states depending
    on the sync result:


    - **Completed syncs** (`status = SYNC_COMPLETE`) — Entries appear on the
    **Sync Complete** page in the Paylocity for Finance UI. They are not
    returned in future GET requests.

    - **Errored syncs** (`status = SYNC_ERROR`) — Entries appear on the
    **Pending Review** page for user review and troubleshooting. Users must
    resolve the issues and mark them ready for sync again. Once updated, they
    will be included in future GET requests.


    ______________________________________________________________________


    ## Webhooks


    Paylocity for Finance provides webhook notifications when ledger entries
    transition to a sync-ready state. See the **Webhooks** section for full
    details on events, payload structure, setup instructions, and best
    practices.
paths:
  /v1/accounting/accounts/:
    get:
      operationId: List Accounts
      description: >-
        Retrieve a paginated list of GL accounts associated with your ERP
        integration.


        ### Account Types


        | Type | Description |

        | --- | --- |

        | `bank` | Bank account |

        | `expense` | Expense account |

        | `expense_category` | Expense category for categorising expense reports
        |

        | `prepayment` | Prepayment / amortisation account |

        | `accounts_payable` | Accounts payable |

        | `checking` | Checking account |

        | `credit_card` | Credit card account |


        ### Unique Constraint


        `erp_reference_id` + `type` must be unique per integration. The same
        `erp_reference_id`

        is allowed with different `type` values (e.g. the same reference can be
        both an `expense`

        and a `checking` account). Entities with an empty or null
        `erp_reference_id` are exempt.


        ### Hierarchical Chart of Accounts


        Use `erp_parent_reference_id` to represent parent–child account
        relationships.

        The parent account must already exist in the platform before it can be
        referenced.


        ### Multi-Subsidiary Accounts


        An account can be shared across multiple subsidiaries by including all
        subsidiary

        references in `subsidiary_reference_ids`.


        **Query Parameters:**


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `erp_reference_id` | string | No | Filter by ERP reference ID
        (case-insensitive) |

        | `page` | integer | No | Page number (default: 1) |

        | `page_size` | integer | No | Results per page |


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 401 | Unauthorized — token missing or invalid |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: List Accounts
      parameters:
        - in: query
          name: erp_reference_id
          schema:
            type: string
          description: >-
            Filter entities by their ERP reference identifier (case-insensitive
            match).
        - in: query
          name: page
          schema:
            type: integer
          description: Page number of the paginated entity list.
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - Accounts
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalGLAccountReadList'
              examples:
                ListResponse:
                  value:
                    data:
                      - id: 123e4567-e89b-12d3-a456-426614174000
                        airbase_id: 123e4567-e89b-12d3-a456-426614174000
                        erp_reference_id: ACCT-001
                        erp_parent_reference_id: null
                        name: Operating Expenses
                        is_active: true
                        subsidiary_reference_ids:
                          - id: abc12345-e89b-12d3-a456-426614174000
                            airbase_id: abc12345-e89b-12d3-a456-426614174000
                            erp_reference_id: SUB-001
                          - id: def67890-e89b-12d3-a456-426614174001
                            airbase_id: def67890-e89b-12d3-a456-426614174001
                            erp_reference_id: SUB-002
                        account_number: '5000'
                        type: expense
                        category: Operational
                        erp_currency_reference_id: USD-001
                      - id: 223e4567-e89b-12d3-a456-426614174001
                        airbase_id: 223e4567-e89b-12d3-a456-426614174001
                        erp_reference_id: ACCT-002
                        erp_parent_reference_id: ACCT-001
                        name: Travel Expenses
                        is_active: true
                        subsidiary_reference_ids:
                          - id: abc12345-e89b-12d3-a456-426614174000
                            airbase_id: abc12345-e89b-12d3-a456-426614174000
                            erp_reference_id: SUB-001
                        account_number: '5100'
                        type: expense
                        category: Travel
                        erp_currency_reference_id: USD-001
                      - id: 323e4567-e89b-12d3-a456-426614174002
                        airbase_id: 323e4567-e89b-12d3-a456-426614174002
                        erp_reference_id: ACCT-003
                        erp_parent_reference_id: ACCT-001
                        name: Administrative Expenses
                        is_active: true
                        subsidiary_reference_ids:
                          - id: abc12345-e89b-12d3-a456-426614174000
                            airbase_id: abc12345-e89b-12d3-a456-426614174000
                            erp_reference_id: SUB-001
                        account_number: '5200'
                        type: expense
                        category: Administrative
                        erp_currency_reference_id: USD-001
                    pagination:
                      next: null
                      previous: null
                      page: 1
                      page_size: 250
                  summary: Paginated list of GL accounts.
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
    post:
      operationId: Create Account
      description: >-
        Create a new GL account entity.


        **Required fields:**


        | Field | Type | Description |

        | --- | --- | --- |

        | `name` | string | Display name |

        | `account_number` | string | Account number in the chart of accounts |

        | `type` | string | Account type — see Account Types in the List
        endpoint |


        **Optional fields:**


        | Field | Type | Description |

        | --- | --- | --- |

        | `erp_reference_id` | string | Unique ERP reference ID
        (case-insensitive for uniqueness checks) |

        | `erp_parent_reference_id` | string | Parent account reference ID for
        hierarchy |

        | `erp_currency_reference_id` | string | Reference ID of the account's
        functional currency |

        | `category` | string | Classification label |

        | `subsidiary_reference_ids` | array | Subsidiaries this account belongs
        to |


        ### Subsidiary Reference IDs Format


        Each entry in `subsidiary_reference_ids` must be an object with:

        - `id` — the unique identifier (UUID) assigned by the platform when the
        subsidiary was created

        - `airbase_id` — **deprecated** legacy alias for `id`; still accepted
        for backward compatibility during the partner migration window

        - `erp_reference_id` — the ERP reference ID of the subsidiary


        **Important:** Subsidiaries must be created first via the Subsidiaries
        API before they

        can be referenced here.


        `is_active` is managed internally and cannot be set on create.


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 201 | Created |

        | 400 | Validation error, duplicate `erp_reference_id`, or read-only
        mode |

        | 401 | Unauthorized |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Create Account
      tags:
        - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalGLAccountWriteRequest'
            examples:
              CreateRequest:
                value:
                  erp_reference_id: ACCT-004
                  erp_parent_reference_id: ACCT-001
                  name: Marketing Expenses
                  account_number: '5200'
                  type: expense
                  category: Marketing
                  subsidiary_reference_ids:
                    - id: abc12345-e89b-12d3-a456-426614174000
                      airbase_id: abc12345-e89b-12d3-a456-426614174000
                      erp_reference_id: SUB-001
                    - id: def67890-e89b-12d3-a456-426614174001
                      airbase_id: def67890-e89b-12d3-a456-426614174001
                      erp_reference_id: SUB-002
                  erp_currency_reference_id: USD-001
                summary: Create a new GL account.
        required: true
      security:
        - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGLAccountWrite'
              examples:
                CreateResponse:
                  value:
                    id: 423e4567-e89b-12d3-a456-426614174003
                    airbase_id: 423e4567-e89b-12d3-a456-426614174003
                    erp_reference_id: ACCT-004
                    name: Marketing Expenses
                    is_active: true
                  summary: Newly created GL account.
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
  /v1/accounting/accounts/{uuid}/:
    get:
      operationId: Retrieve Account
      description: >-
        Retrieve a single GL account by its unique identifier (`id`).


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes | The unique identifier of the account. The legacy
        path segment `airbase_id` continues to accept the same UUID during the
        migration window. |


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Invalid UUID format |

        | 401 | Unauthorized |

        | 404 | Entity not found |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Retrieve Account
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      tags:
        - Accounts
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGLAccountRead'
              examples:
                RetrieveResponse:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    airbase_id: 123e4567-e89b-12d3-a456-426614174000
                    erp_reference_id: ACCT-001
                    erp_parent_reference_id: null
                    name: Operating Expenses
                    is_active: true
                    subsidiary_reference_ids:
                      - id: abc12345-e89b-12d3-a456-426614174000
                        airbase_id: abc12345-e89b-12d3-a456-426614174000
                        erp_reference_id: SUB-001
                    account_number: '5000'
                    type: expense
                    category: Operational
                    erp_currency_reference_id: USD-001
                  summary: Single GL account details.
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
    patch:
      operationId: Update Account
      description: >-
        Update an existing GL account.


        **Updatable fields:**


        | Field | Type | Description |

        | --- | --- | --- |

        | `name` | string | Display name |

        | `account_number` | string | Account number |

        | `type` | string | Account type |

        | `category` | string | Classification label |

        | `erp_parent_reference_id` | string | Parent account reference |

        | `erp_currency_reference_id` | string | Functional currency reference |

        | `subsidiary_reference_ids` | array | Associated subsidiaries |


        > **Note:** When updating `type`, the combination of
        (`erp_reference_id`, `type`) must

        > remain unique within the integration. You cannot change `type` to a
        value that would

        > create a duplicate.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes | The unique identifier of the account to update.
        The legacy path segment `airbase_id` continues to accept the same UUID
        during the migration window. |


        `erp_reference_id` cannot be updated once set. `is_active` is managed
        internally and cannot be changed.


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Invalid UUID, read-only mode, or attempting to update immutable
        fields |

        | 401 | Unauthorized |

        | 404 | Entity not found |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Update Account
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      tags:
        - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalGLAccountUpdateRequest'
            examples:
              UpdateRequest:
                value:
                  name: Marketing & Advertising Expenses
                  category: Marketing & Advertising
                summary: Update account name and category.
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGLAccountUpdate'
              examples:
                UpdateResponse:
                  value:
                    id: 423e4567-e89b-12d3-a456-426614174003
                    airbase_id: 423e4567-e89b-12d3-a456-426614174003
                    erp_reference_id: ACCT-004
                    erp_parent_reference_id: ACCT-001
                    name: Marketing & Advertising Expenses
                    is_active: true
                    subsidiary_reference_ids:
                      - id: abc12345-e89b-12d3-a456-426614174000
                        airbase_id: abc12345-e89b-12d3-a456-426614174000
                        erp_reference_id: SUB-001
                    account_number: '5200'
                    type: expense
                    category: Marketing & Advertising
                    erp_currency_reference_id: USD-001
                  summary: Updated GL account.
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
    delete:
      operationId: Delete Account
      description: >-
        Soft-delete a GL account. The account is deactivated and will no longer
        appear in list

        results or be available for GL mappings.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes | The unique identifier of the account to delete.
        The legacy path segment `airbase_id` continues to accept the same UUID
        during the migration window. |


        Soft-deletes the entity — sets `is_active` to `false`. The entity will
        no longer appear in list results.


        Returns **204 No Content** on success.


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 204 | Deleted |

        | 400 | Invalid UUID or read-only mode |

        | 401 | Unauthorized |

        | 404 | Entity not found |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Delete Account
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
      tags:
        - Accounts
      security:
        - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
  /v1/accounting/accounts/bulk_upsert/:
    post:
      operationId: Bulk Upsert Accounts
      description: >-
        Create or update up to 500 GL accounts in a single atomic request.


        ### Matching Key


        Accounts are matched by the **composite key** `erp_reference_id` +
        `type` (case-insensitive),

        **not** by `erp_reference_id` alone. This allows the same
        `erp_reference_id` to represent

        different account objects (e.g. both an `expense` account and an
        `expense_category`).


        ### Unique Constraints


        - `erp_reference_id` + `type` must be unique per integration.

