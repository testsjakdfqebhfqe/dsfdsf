  /v1/payment_transactions/{id}/:
    get:
      operationId: Retrieve Payment Transaction
      description: >-
        Retrieve the full balance-impact history for a single payment
        transaction.


        A transaction may produce impacts in **multiple months** when it is
        authorized in one month

        and settled in another, or when its settled amount is later adjusted.


        The response is an array of `PaymentTransactionRecord` objects — one per
        balance impact event.


        ### Settlement Adjustments


        When a settled amount changes, the **adjustment month** contains two
        records:

        1. A reversal of the prior settled amount (positive `amount`).

        2. The new settled amount (negative `amount`).


        Sum both records to get the net impact for that month.


        ### Non-Consecutive Months


        A transaction can have impacts in non-consecutive months. For example,
        it may settle in

        January and receive an adjustment in April, with no impacts in February
        or March.


        ### Empty History


        If the transaction has no balance impacts, the API returns an **empty
        array** `[]`.


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns an array of balance-impact records |

        | 401 | Unauthorized |

        | 404 | Transaction not found, or transaction ID is not valid |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Retrieve Payment Transaction Detail
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: The payment transaction ID.
          required: true
      tags:
        - Payment Transactions
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTransactionRecord'
              examples:
                RetrieveResponse:
                  value:
                    - transaction_id: 019750a2-3b4c-7def-8901-234567890abc
                      created_date: '2025-01-15T10:30:00Z'
                      posting_date: '2025-01-15T10:30:00Z'
                      description: AMAZON WEB SERVICES
                      amount: '-500.00'
                      currency: USD
                      type: card.payment
                      status: pending
                      is_real_time_sync: false
                    - transaction_id: 019750a2-3b4c-7def-8901-234567890abc
                      created_date: '2025-01-15T10:30:00Z'
                      posting_date: '2025-02-03T00:00:00Z'
                      description: AMAZON WEB SERVICES
                      amount: '-500.00'
                      currency: USD
                      type: card.payment
                      status: settled
                      is_real_time_sync: false
                  summary: >-
                    Balance-impact history for a single transaction (pending in
                    January, settled in February).
          description: ''
        '401':
          content:
            application/json:
