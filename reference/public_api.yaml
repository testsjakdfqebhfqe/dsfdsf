  /v1/payment_transactions/:
    get:
      operationId: List Payment Transactions
      description: >-
        Retrieve a paginated list of payment transactions for a subsidiary in a
        given calendar month.


        You can use this endpoint to:

        - Retrieve all payment transactions for a subsidiary and month.

        - Reproduce the closing balance calculation from the balance report
        export.

        - Filter transactions by payment product for product-specific balances.


        ---


        ## Core Concepts


        ### Balance Period


        A balance period is a calendar month identified by a `(year, month)`
        pair.


        | Value | Description |

        | --- | --- |

        | **Opening Settled Balance** | Settled balance at the start of the
        month (equal to the previous month's closing settled balance). |

        | **Closing Settled Balance** | Settled balance at the end of the month.
        |

        | **Closing Pending Balance** | Total outstanding amount of transactions
        still in a pending or created state at month end. |


        > **Ongoing month:** For the current (incomplete) month, balance impacts
        may change as new transactions are created, pending transactions settle,
        or settlement amounts are adjusted. Always refetch the entire current
        month to get the most up-to-date data.


        ### Transaction Statuses


        | Status | Meaning |

        | --- | --- |

        | `created` | Transaction initiated but not yet pending at the card
        network / payment processor. |

        | `pending` | Transaction authorized / in-flight but not yet settled. |

        | `settled` | Transaction fully settled. |

        | `declined` | Transaction was declined or reversed after authorization.
        |


        ### Payment Products


        | Payment Product | Description |

        | --- | --- |

        | Airbase Pre-Funded Card | Debit / pre-funded virtual and physical card
        transactions. |

        | Airbase Charge Card | Charge card transactions. |

        | AMEX Credit Card | American Express credit card transactions. |

        | SVB Credit Card | SVB credit card transactions. |

        | Direct Card Expenses | Bring-your-own-card (BYOC) transactions. |

        | Bill Payments | Vendor bill payments (ACH, check, wire,
        international). |

        | Reimbursements | Employee reimbursement payments. |


        ### Payment Product Filter Values


        When filtering by `payment_product`, use one of these values:


        | Filter Value | Matches |

        | --- | --- |

        | `pre_funded_cards` | Airbase Pre-Funded Card |

        | `charge_cards` | Airbase Charge Card, AMEX Credit Card, SVB Credit
        Card, Direct Card Expenses |

        | `bill_payments` | Bill Payments (includes vendor credit applications
        and Airbase fees on international payments) |

        | `reimbursements` | Reimbursements |


        ### Real-Time Sync (Sync Payment Entry When Bill is Paid)


        Transactions with `is_real_time_sync = true` **do not** contribute to
        the Closing Settled Balance or Closing Pending Balance. They appear in
        API responses for visibility but must be **excluded** when computing
        balances.


        ### Currency


        For Airwallex subsidiaries whose base currency is not USD, amounts are
        returned in the subsidiary's base currency. For all other subsidiaries,
        amounts are in USD. The `currency` field in the response indicates which
        currency is used.


        All monetary values (`amount`, `transaction_currency_amount`) are
        expressed as decimal amounts in the given currency (e.g. dollars for
        USD, pounds for GBP), rounded to 2 decimal places.


        ---


        ## Query Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `subsidiary_id` | uuid | **Yes** | Platform subsidiary ID to fetch
        transactions for |

        | `year` | integer | **Yes** | Calendar year (e.g. 2025) |

        | `month` | integer | **Yes** | Calendar month, 1–12 |

        | `payment_product` | string | No | Filter by product. See Payment
        Product Filter Values above |

        | `page` | integer | No | Page number (default: 1) |

        | `page_size` | integer | No | Results per page (default: 250, max:
        1000) |


