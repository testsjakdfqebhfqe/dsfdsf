    CardCurrencyData:
      type: object
      description: Card-currency data derived from the parent subscription.
      properties:
        iso_code:
          type: string
          readOnly: true
          description: ISO 4217 currency the card transacts in (e.g. `USD`).
        spend_limit:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Spend limit per `spend_limit_window`, in the card currency (e.g.
            `5000.00`). Decimal precision follows the currency's minor units —
            two places for `USD`, none for `JPY`.
        total_spend:
          type: string
          nullable: true
          readOnly: true
          description: >-
            All-time spend on the card, in the card currency. Includes settled
            transactions only. Decimal precision follows the currency's minor
            units — two places for `USD`, none for `JPY`.
      required:
        - iso_code
        - spend_limit
        - total_spend
    CardExpiry:
      type: object
      properties:
        month:
          type: integer
          description: Expiry month (1-12).
        year:
          type: integer
          description: Four-digit expiry year (e.g. 2029).
      required:
        - month
        - year
    CardListRecord:
      type: object
      description: |-
        Serializer for a card record as returned by the list endpoint.

        Omits the per-card-expensive fields served only on retrieve by
        :class:`CardRecordSerializer` — ``card_number_last_digits``,
        ``last_charged_date``, ``expiry``, ``mcc_controls``,
        ``card_currency_data`` and ``issuing_currency_data``.
      properties:
        id:
          type: string
          format: uuid
          description: Card ID.
        card_type:
          allOf:
            - $ref: '#/components/schemas/CardTypeEnum'
          readOnly: true
          description: >-
            Card type: `ONE_TIME_VC` for single-use virtual cards,
            `RECURRING_VC` for reusable virtual cards, `PHYSICAL` for physical
            cards.


            * `ONE_TIME_VC` - ONE_TIME_VC

            * `RECURRING_VC` - RECURRING_VC

            * `PHYSICAL` - PHYSICAL
        status:
          allOf:
            - $ref: '#/components/schemas/CardStatusEnum'
          description: >-
            Card status: inactive cards are `SUSPENDED`; active physical cards
            are `UNACTIVATED` until activated; all other active cards are
            `ACTIVATED`.
          readOnly: true
        suspend_reason:
          description: >-
            Optional field which has value if suspend reason is available,
            Possible for Suspended cards to have blank suspend_reason


            * `NON_COMPLIANT_OWNER` - NON_COMPLIANT_OWNER

            * `` - 
          oneOf:
            - $ref: '#/components/schemas/SuspendReasonEnum'
            - $ref: '#/components/schemas/BlankEnum'
        owner:
          allOf:
            - $ref: '#/components/schemas/CardOwner'
          description: The user who owns the card.
        subsidiary:
          allOf:
            - $ref: '#/components/schemas/CardSubsidiary'
          description: The subsidiary the card belongs to.
        vendor:
          allOf:
            - $ref: '#/components/schemas/CardVendor'
          nullable: true
          description: The vendor the card is assigned to; `null` if unassigned.
        is_business_critical:
          type: boolean
          description: Whether the card is marked business critical.
        spend_limit_window:
          allOf:
            - $ref: '#/components/schemas/SpendLimitWindowEnum'
          description: >-
            Window the spend limit applies over: `day`, `week`, `month`,
            `quarter`, `year`, `lifetime`, or `transaction`.


            * `day` - day

            * `week` - week

            * `month` - month

            * `quarter` - quarter

            * `year` - year

            * `lifetime` - lifetime

            * `transaction` - transaction
        receipt_compliance_enabled:
          type: boolean
          description: Whether receipt compliance enforcement is enabled for the card.
        lock_status:
          allOf:
            - $ref: '#/components/schemas/LockStatusEnum'
          description: |-
            Card lock state: `locked`, `unlocked`, or `pending`.

            * `locked` - locked
            * `unlocked` - unlocked
            * `pending` - pending
        lock_date:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp the card is locked or scheduled to lock; `null` when no
            lock is set.
      required:
        - card_type
        - id
        - is_business_critical
        - lock_date
        - lock_status
        - owner
        - receipt_compliance_enabled
        - spend_limit_window
        - status
        - subsidiary
        - suspend_reason
        - vendor
    CardMccControl:
      type: object
      properties:
        group_name:
          type: string
          description: Name of the merchant category group (e.g. Airlines).
        control:
          allOf:
            - $ref: '#/components/schemas/ControlEnum'
          description: >-
            How spend in this category is treated: `allowed`, `blocked`, or
            `flagged`.


            * `allowed` - ALLOWED

            * `flagged` - FLAGGED

            * `blocked` - BLOCKED
      required:
