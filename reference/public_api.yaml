        - currency
        - description
        - expense_report_id
        - gl_vendor_id
        - gl_vendor_name
        - invoice_number
        - is_real_time_sync
        - payment_method
        - payment_product
        - posting_date
        - reimbursement_payment_id
        - spend_owner_id
        - spend_owner_name
        - status
        - subsidiary_id
        - subsidiary_name
        - transaction_currency
        - transaction_currency_amount
        - transaction_id
        - type
        - vendor_id
        - vendor_name
        - vendor_payment_id
