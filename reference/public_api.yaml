  /v1/accounting/ledger_entries/{uuid}/:
    get:
      operationId: Retrieve Ledger Entry
      description: >-
        Retrieve complete details of a single ledger entry by its uuid (`id`),

        including all line items, tags, and synchronisation metadata.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes | The unique identifier of the ledger entry. The
        legacy path segment `airbase_id` continues to accept the same UUID
        during the migration window. |


        ### `amounts`


        A breakdown of the entry's amount across every relevant currency view,
        each

        expressed as `{"amount": <amount upto 2 decimal points>, "currency":
        {"erp_reference_id": <ERP currency ref or null>, "iso_code": "<ISO 4217
        code>"}}`

        (or `null` when that view does not apply to this entry type):


        | Key | Description |

        | --- | --- |

        | `amount` | The USD "book" amount. |

        | `transaction_amount` | Amount in the original transaction
        (merchant/vendor) currency. |

        | `settlement_amount` | Amount in the card-network settlement currency.
        `null` when there is no distinct settlement leg (e.g. bills,
        reimbursements). |

        | `subsidiary_amount` | Amount in the owning subsidiary's GL currency.
        `null` when it cannot be resolved. |


        > **Note**: `amounts` is also present on the list endpoint (see the
        `list`

        > action documentation above).


        ### `custom_fields`


        Both the top level of the entry (transaction-level custom fields) and

        each item in `expense_list` (line-level custom fields) include a

        `custom_fields` array. Each entry has the shape:


        ```

        {
          "name": {
            "erp_reference_id": "<custom field's reference_id>",
            "label": "<custom field's name>",
            "type": "<the custom field's type>"
          },
          "values": [
            {
              "erp_reference_id": "<option's reference_id, or null>",
              "value": "<the value>"
            }
          ]
        }

        ```


        `values` is always an array — one element for single-valued field types,

        one element per selected option for `MULTI_SELECT` fields, and empty

        (`[]`) when nothing has been entered. `erp_reference_id` inside `values`

        is only populated for `SELECT`/`RADIO_SELECT`/`MULTI_SELECT` fields

        (it's the chosen option's own reference ID); every other field type

        leaves it `null` and puts the raw value in `value`. `type` (on `name`,

        since it's a property of the field itself, not of each value) is the

        same value the custom field definitions API returns as its own `type`

        field (e.g. `FREE_FORM_TEXT`, `SELECT`, `INTEGER`).


        Custom fields with no ERP-facing definition (i.e. no corresponding

        entry visible via `GET /v1/accounting/custom-fields/`) are omitted from

        this array entirely.


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 401 | Unauthorized |

        | 404 | No ledger entry matches the provided ID |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
