            `X-RateLimit-Remaining` headers for quota details.
  /v1/accounting/prepayment_entries/:
    get:
      operationId: List Prepayment Entries
      description: >-
        Retrieve a paginated list of prepayment (amortisation) entries linked to
        parent ledger entries.


        By default, entries with `status=sync_ready` **or** `status=SYNC_ERROR`
        are returned.

        Use the `status` query parameter to narrow to a specific state.


        ### Query Parameters


        | Parameter | Type | Required | Default | Description |

        | --- | --- | --- | --- | --- |

        | `status` | string | No | `sync_ready` or `sync_error` | Filter by sync
        status. Allowed: `sync_ready`, `sync_complete`, `sync_error` |

        | `subsidiary` | UUID | No | — | Filter by GL subsidiary ID |

        | `ledger_entry_id` | UUID | No | — | Filter by parent ledger entry ID |

        | `prepayment_entry_ids` | string | No | — | Comma-separated list of
        prepayment entry UUIDs (bulk GET) |

        | `prepayment_entry_date_start` | date | No* | — | Start date for entry
        date range filter (ISO 8601: YYYY-MM-DD) |

        | `prepayment_entry_date_end` | date | No* | — | End date for entry date
        range filter (ISO 8601: YYYY-MM-DD) |

        | `page` | integer | No | 1 | Page number for pagination |

        | `page_size` | integer | No | 20 | Number of entries per page |


        > `prepayment_entry_date_start` and `prepayment_entry_date_end` must
        both be provided together.


        ### Important Notes


        1. **Unknown parameters** — any unrecognised query parameter causes the
        endpoint to return an empty result set.

        2. **Date range validation** — start date cannot be after end date.

        3. **Default behaviour** — without a `status` filter, entries with
        `sync_ready` **or** `sync_error` status are returned (different from
        ledger entries, which default to `sync_ready` only).


        ### Relationship with Ledger Entries


        Prepayment entries are linked to parent ledger entries via the
        `ledger_entry_id` or (or the deprecated `airbase_ledger_entry_id`)
        field.

        **Always sync the parent ledger entry first, then sync its associated
        prepayment entries.**


        Recommended workflow:


        ### Status Values Reference


        | Status | Description |

        | --- | --- |

        | `sync_ready` | Entry is ready to be synced to ERP |

        | `sync_complete` | Entry has been successfully synced to ERP |

        | `sync_error` | Entry failed to sync — check `error_message` for
        details |


        ### `amounts`


        A breakdown of each entry's amount across every relevant currency view,
        each

        expressed as `{"amount": <amount upto 2 decimal points>, "currency":
        {"erp_reference_id": <ERP currency ref or null>, "iso_code": "<ISO 4217
        code>"}}`

        (or `null` when that view does not apply to this entry type). A
        prepayment

        entry represents a single amortized slice of its parent ledger entry
        (e.g.

        one per month), so `amounts` reflects that specific slice — not the
        parent

        entry's total — and differs across the prepayment entries generated from

        the same parent:


        | Key | Description |

        | --- | --- |

        | `amount` | The USD "book" amount of this slice. |

        | `transaction_amount` | Always `null` — not tracked at the per-slice
        granularity. |

        | `settlement_amount` | Always `null` — not tracked at the per-slice
        granularity. |

        | `subsidiary_amount` | Amount in the owning subsidiary's GL currency
        for this slice. `null` when it cannot be resolved. |


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Invalid query parameters or date range error |

        | 401 | Unauthorized |

        | 404 | Not found |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: List all Prepayment Entries
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
