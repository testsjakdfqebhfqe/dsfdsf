      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryBulkUpdateResponse'
              examples:
                BulkUpdateResponse:
                  value:
                    success_count: 2
                    fail_count: 1
                    entry_errors:
                      - id: 345e6789-e89b-12d3-a456-426614174002
                        airbase_id: 345e6789-e89b-12d3-a456-426614174002
                        messages:
                          - Ledger entry not found.
                  summary: Response with partial success results.
          description: ''
        '400':
          content:
