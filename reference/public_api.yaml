  /v1/accounting/ledger_entries/bulk_update/:
    post:
      operationId: Bulk Update Ledger Entries
      description: >-
        Update multiple ledger entries in a single request. This endpoint
        supports

        **partial success** — valid entries are updated even if some fail
        validation or are not found.

        Maximum batch size is **50 entries** per request.


        ### Endpoint


        ### Request Body


        | Field | Type | Required | Description |

        | --- | --- | --- | --- |

        | `entries` | array | Yes | Array of entry update objects (max 50) |


        #### Entry Update Object


        | Field | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes* | The unique identifier of the ledger entry to
        update |

        | `airbase_id` | UUID | Yes* | **Deprecated** — legacy alias for `id`.
        Accepted for backward compatibility during the partner migration window.
        |

        | `status` | string | No | New status. Allowed: `sync_ready`,
        `sync_error`, `sync_complete` |

        | `erp_reference_id` | string | No | The journal entry reference ID
        assigned in your ERP |

        | `erp_url` | string (URL) | No | Direct URL to the entry in your ERP
        system |

        | `error_message` | string | No | Error description (only valid when
        `status` is `sync_error`) |


        > \* Exactly one of `id` or the deprecated `airbase_id` must be provided
        per entry. When both are supplied they must reference the same UUID.


        ### Validation Rules


        1. **Batch size limit** — maximum 50 entries per request.

        2. **Minimum entries** — at least 1 entry must be provided.

        3. **Unique IDs** — no duplicate `id` (or the deprecated `airbase_id`)
        values allowed in the same request.

        4. **Per-entry validation** — each entry must have at least one
        updatable field (`status`, `erp_reference_id`, `erp_url`, or
        `error_message`).

        5. **Error message constraint** — `error_message` can only be provided
        when `status` is `sync_error`.


        ### Response Fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `success_count` | integer | Number of entries successfully updated |

        | `fail_count` | integer | Number of entries that failed to update |

        | `entry_errors` | array | List of failed entries with their error
        messages. Each item carries both `id` and the deprecated `airbase_id`
        alias. |


        ### Best Practices


        1. **Batch strategically** — group related entries together for easier
        error handling.

        2. **Handle partial failures** — always check `entry_errors` in the
        response to identify and retry failed updates.

        3. **Idempotency** — the bulk update is idempotent; running the same
        request multiple times produces the same result.

        4. **Rate limiting** — for large volumes, split into multiple requests
        of up to 50 entries each.


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns update results (may include partial failures)
        |

        | 400 | Invalid payload structure or validation errors |

        | 401 | Unauthorized |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Bulk Update Ledger Entries
      tags:
        - Ledger Entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerEntryBulkUpdateRequestRequest'
            examples:
              BulkUpdateRequest:
                value:
                  entries:
                    - id: 123e4567-e89b-12d3-a456-426614174000
                      airbase_id: 123e4567-e89b-12d3-a456-426614174000
                      status: sync_complete
                      erp_reference_id: JE-2026-001234
                      erp_url: https://erp.example.com/journal-entries/JE-2026-001234
                    - id: 234e5678-e89b-12d3-a456-426614174001
                      airbase_id: 234e5678-e89b-12d3-a456-426614174001
                      status: sync_error
                      error_message: Account 6000 is inactive in the ERP system
                    - id: 345e6789-e89b-12d3-a456-426614174002
                      airbase_id: 345e6789-e89b-12d3-a456-426614174002
                      status: sync_complete
                      erp_reference_id: JE-2026-001235
                summary: Update multiple ledger entries with sync results.
        required: true
      security:
