    LedgerEntryBulkUpdateError:
      type: object
      description: |-
        Serializer for individual entry errors in bulk update response.

        Emits both the new id field and the deprecated airbase_id
        alias so partners on either side of the migration can identify the
        failed entry.
      properties:
        id:
          type: string
          description: Unique identifier (UUID) of the entry that failed.
        airbase_id:
          type: string
          description: Deprecated alias for id. Retained for backward compatibility.
        messages:
          type: array
          items:
            type: string
          description: List of error messages for this entry.
      required:
        - airbase_id
        - id
        - messages
    LedgerEntryBulkUpdateItemRequest:
      type: object
      description: >-
        Serializer for a single ledger entry update item within a bulk update
        request.


        Extends LedgerEntryUpdateSerializer to add the airbase_id field for
        identification.

        "Duplicate airbase_id values are not allowed in the same request."
            required=True,
            help_text="The Airbase UUID of the ledger entry to update.",
            help_text="The Airbase UUID of the entry that failed."
        exposed under both keys in validated_data so downstream code

        that still reads airbase_id continues to work.
      properties:
        erp_reference_id:
          type: string
          nullable: true
          description: The ERP reference ID to set on the ledger entry.
        erp_url:
          type: string
          format: uri
          nullable: true
          description: The URL to the ledger entry in the ERP system.
        status:
          allOf:
            - $ref: '#/components/schemas/LedgerEntryStatusEnum'
          description: >-
            The status to set on the ledger entry. Allowed values: SYNC_READY,
            SYNC_ERROR, SYNC_COMPLETE.


            * `sync_ready` - sync_ready

            * `sync_error` - sync_error

            * `sync_complete` - sync_complete
        error_message:
          type: string
          nullable: true
          description: Error message to set when status is SYNC_ERROR.
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID) of the ledger entry to update.
        airbase_id:
          type: string
          format: uuid
          description: >-
            Deprecated alias for id. Accepted in requests for backward
            compatibility during the partner transition window.
    LedgerEntryBulkUpdateRequestRequest:
      type: object
      description: Serializer for the bulk update request payload.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryBulkUpdateItemRequest'
          description: List of ledger entries to update. Maximum 50 entries per request.
          maxItems: 50
          minItems: 1
      required:
        - entries
    LedgerEntryBulkUpdateResponse:
      type: object
      description: Serializer for the bulk update response.
      properties:
        success_count:
          type: integer
          description: Number of entries successfully updated.
        fail_count:
          type: integer
          description: Number of entries that failed to update.
        entry_errors:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryBulkUpdateError'
          description: List of entries that failed with their respective errors.
      required:
        - entry_errors
        - fail_count
        - success_count
