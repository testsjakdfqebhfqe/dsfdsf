    LedgerEntryCustomFieldValue:
      type: object
      description: |-
        Renders a single LedgerEntryCustomFieldKeyValuePair as
        {name: {erp_reference_id, label, type},
         values: [{erp_reference_id, value}, ...]}.

        Dispatch is by storage column (select / multi-select / scalar), not by
        the set of types the create API accepts — rendering has to handle
        whatever's actually stored, including legacy field types. ``values`` is
        always an array: one element for single-valued types, one element per
        selected option for MULTI_SELECT, empty if nothing is set. ``type``
        lives on ``name`` (it's a property of the field, not of each value) —
        the same value returned by the custom field definitions API.
      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/LedgerEntryCustomFieldName'
          readOnly: true
        values:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryCustomFieldValueItem'
          readOnly: true
      required:
        - name
        - values
    LedgerEntryCustomFieldValueItem:
      type: object
      properties:
        erp_reference_id:
          type: string
          nullable: true
          description: >-
            The chosen option's ERP reference ID. Only populated for
            SELECT/RADIO_SELECT/MULTI_SELECT fields — null for every other type.
        value:
          nullable: true
          description: >-
            The value itself — a string, number, or boolean depending on the
            field's type, or the chosen option's display value for
            SELECT/RADIO_SELECT/MULTI_SELECT fields.
      required:
        - erp_reference_id
        - value
