      description: >-
        Retrieve a single card by its ID.


        Covers both virtual and physical cards across all card providers; the
        response

        shape is identical regardless of which provider issued the card.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | uuid | Yes | Card ID |


        ---


        ## Response Field Reference


        | Field | Type | Description |

        | --- | --- | --- |

        | `id` | uuid | Card ID |

        | `card_number_last_digits` | string / null | Trailing digits of the
        card number (e.g. `4242`). The count varies by card provider — four
        digits for most, five for American Express — so treat this as a
        variable-length string rather than assuming four. `null` when the card
        number is not yet known |

        | `card_type` | enum | `ONE_TIME_VC` for single-use virtual cards,
        `RECURRING_VC` for reusable virtual cards, `PHYSICAL` for physical cards
        |

        | `status` | enum | `ACTIVATED`, `UNACTIVATED`, or `SUSPENDED`. Inactive
        cards are `SUSPENDED`; active physical cards are `UNACTIVATED` until
        activated; all other active cards are `ACTIVATED` |

        | `suspend_reason` | enum | Why the card was suspended:
        `NON_COMPLIANT_OWNER`. Empty string when the card is not suspended, or
        when a suspended card has no recorded reason |

        | `owner.full_name` | string | Card owner's full name |

        | `owner.email` | string | Card owner's email address |

        | `subsidiary.id` | uuid | Subsidiary ID |

        | `subsidiary.name` | string | Subsidiary name |

        | `vendor` | object / null | The vendor the card is assigned to; `null`
        if unassigned |

        | `vendor.id` | uuid | Vendor ID |

        | `vendor.name` | string | Vendor name |

        | `card_currency_data` | object | Card-currency ISO code and amounts
        denominated in it |

        | `card_currency_data.iso_code` | string | ISO 4217 currency the card
        transacts in (e.g. `USD`).|

        | `card_currency_data.spend_limit` | string (decimal) / null | Spend
        limit per `spend_limit_window`, in the card currency |

        | `card_currency_data.total_spend` | string (decimal) / null | All-time
        settled spend on the card, in the card currency |

        | `issuing_currency_data` | object | Issuing-currency ISO code and
        amounts denominated in it |

        | `issuing_currency_data.iso_code` | string | ISO 4217 currency the card
        was issued in (e.g. `USD`).|

        | `issuing_currency_data.current_window_spend` | string (decimal) / null
        | Total pending and settled spend in the current spend limit window, in
        the issuing currency |

        | `issuing_currency_data.total_spend` | string (decimal) / null |
        All-time settled spend on the card, in the issuing currency |

        | `issuing_currency_data.average_monthly_spend` | string (decimal) /
        null | Average monthly spend on the card, in the issuing currency |

        | `is_business_critical` | boolean | Whether the card is marked business
        critical |

        | `spend_limit_window` | enum | `day`, `week`, `month`, `quarter`,
        `year`, `lifetime`, or `transaction` |

        | `last_charged_date` | string (date) / null | Date the card was last
        charged (`YYYY-MM-DD`); `null` if never charged |

        | `expiry` | object / null | The card's expiry month and year; `null`
        when unknown |

        | `expiry.month` | integer | Expiry month (1-12) |

        | `expiry.year` | integer | Four-digit expiry year (e.g. `2029`) |

        | `receipt_compliance_enabled` | boolean | Whether receipt compliance
        enforcement is enabled for the card |

        | `mcc_controls` | array | Active merchant category (MCC) spend
        controls; empty when none are configured |

        | `mcc_controls[].group_name` | string | Name of the merchant category
        group (e.g. `Airlines`) |

        | `mcc_controls[].control` | enum | How spend in this category is
        treated: `allowed`, `blocked`, or `flagged` |

        | `lock_status` | enum | Card lock state: `locked`, `unlocked`, or
        `pending` |

        | `lock_date` | string (date-time) / null | Timestamp the card is locked
        or scheduled to lock; `null` when no lock is set |


        All timestamps are UTC ISO 8601. All monetary amounts are decimal
        strings; each

        enclosing currency object's `iso_code` identifies the currency in which
        its

        amounts are denominated. Decimal precision follows that currency's minor
        units,

        so amounts are not always given to two places — `USD` has two, `JPY`
        none, `KWD`

        three. Parse these as decimals rather than assuming a fixed scale.


        ---


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns the card record |

        | 401 | Unauthorized |

        | 403 | Public API access is not enabled, or the cards module is not
        enabled for this company |

        | 404 | Card not found, or does not belong to the authenticated company
        |

        | 405 | Method not allowed — only `GET` is supported on this endpoint |

        | 429 | Rate limit exceeded |
      summary: Retrieve Card
