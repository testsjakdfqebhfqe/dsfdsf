    PrepaymentEntryBulkUpdateError:
      type: object
      description: Serializer for individual entry errors in bulk update response.
      properties:
        id:
          type: string
          description: Unique identifier (UUID) of the entry that failed.
        airbase_id:
          type: string
          description: Deprecated alias for ``id``. Retained for backward compatibility.
        messages:
          type: array
          items:
            type: string
          description: List of error messages for this entry.
      required:
        - airbase_id
        - id
        - messages
    PrepaymentEntryBulkUpdateItemRequest:
      type: object
      description: >-
        Serializer for a single prepayment entry update item within a bulk
        update request.


        Extends LedgerEntryUpdateSerializer to add the identifier field for
        identification. Uses the same

        updatable fields as ledger entries (erp_reference_id, erp_url, status,
        error_message).


        `id` is the neutral replacement for the legacy `airbase_id` field
        (Airbase -> Paylocity branding migration).

        Both keys are accepted in requests during the partner transition window;
        when both are provided

        they must match. The normalized UUID is exposed under both keys in
        `validated_data`.
      properties:
        erp_reference_id:
          type: string
          nullable: true
          description: The ERP reference ID to set on the ledger entry.
        erp_url:
          type: string
          format: uri
          nullable: true
          description: The URL to the ledger entry in the ERP system.
        status:
          allOf:
            - $ref: '#/components/schemas/LedgerEntryStatusEnum'
          description: >-
            The status to set on the ledger entry. Allowed values: SYNC_READY,
            SYNC_ERROR, SYNC_COMPLETE.


            * `sync_ready` - sync_ready

            * `sync_error` - sync_error

            * `sync_complete` - sync_complete
        error_message:
          type: string
          nullable: true
          description: Error message to set when status is SYNC_ERROR.
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID) of the prepayment entry to update.
        airbase_id:
          type: string
          format: uuid
          description: >-
            Deprecated alias for id. Accepted in requests for backward
            compatibility during the partner transition window.
    PrepaymentEntryBulkUpdateRequestRequest:
      type: object
      description: Serializer for the bulk update request payload.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PrepaymentEntryBulkUpdateItemRequest'
          description: >-
            List of prepayment entries to update. Maximum 50 entries per
            request.
          maxItems: 50
          minItems: 1
      required:
        - entries
    PrepaymentEntryBulkUpdateResponse:
      type: object
      description: Serializer for the bulk update response.
      properties:
        success_count:
          type: integer
          description: Number of entries successfully updated.
        fail_count:
          type: integer
          description: Number of entries that failed to update.
        entry_errors:
          type: array
          items:
            $ref: '#/components/schemas/PrepaymentEntryBulkUpdateError'
          description: List of entries that failed with their respective errors.
      required:
        - entry_errors
        - fail_count
        - success_count
    PublicAPIError:
      type: object
      description: >-
        Standard Public API error response: ``{"error_code": ...,
        "error_message": ...}`` shape.


        Used for pre-validation failures (read-only mode, empty batch, duplicate

        entities within a single request) as well as not-found errors surfaced
        via

        ``catch_all_exception_handler``.
      properties:
        error_code:
          type: integer
          description: Numeric error code.
        error_message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          additionalProperties: {}
          nullable: true
          description: Additional error context with field-level details.
      required:
        - error_code
        - error_message
    PublicApiAccount:
      type: object
      properties:
        erp_reference_id:
          type: string
          description: Reference ID of the GL account in the ERP system.
        name:
          type: string
          readOnly: true
          description: Display name of the GL account.
      required:
        - erp_reference_id
        - name
    PublicApiAmounts:
      type: object
      description: |-
        Amount + currency breakdown across every currency view tracked for a
        ledger entry. Mirrors ``LedgerEntry.ledger_entry_all_amounts()``.
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PublicApiMoney'
          nullable: true
          description: USD 'book' amount.
        transaction_amount:
          allOf:
            - $ref: '#/components/schemas/PublicApiMoney'
          nullable: true
          description: Amount in the original transaction (merchant/vendor) currency.
        settlement_amount:
          allOf:
            - $ref: '#/components/schemas/PublicApiMoney'
          nullable: true
          description: >-
            Amount in the card-network settlement currency. Null when there is
            no distinct settlement leg (e.g. bills, reimbursements).
        subsidiary_amount:
          allOf:
            - $ref: '#/components/schemas/PublicApiMoney'
          nullable: true
          description: >-
            Amount in the owning subsidiary's GL currency. Null when it cannot
            be resolved.
      required:
        - amount
        - settlement_amount
        - subsidiary_amount
        - transaction_amount
    PublicApiCurrency:
      type: object
      properties:
        erp_reference_id:
          type: string
          nullable: true
          description: Reference ID of the currency in the ERP system.
        iso_code:
          type: string
          readOnly: true
          nullable: true
          description: ISO 4217 currency code (e.g. 'USD', 'EUR').
      required:
        - iso_code
    PublicApiEmployee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Internal unique identifier (UUID) of the employee.
        airbase_id:
          type: string
          format: uuid
          description: Deprecated alias for ``id``. Retained for backward compatibility.
        name:
          type: string
          readOnly: true
        erp_reference_id:
          type: string
          description: Reference ID of the employee in the ERP system.
        created_in_platform:
          type: boolean
          description: >-
            Whether this vendor was created in the platform (true) or synced
            from the ERP (false).
        created_in_airbase:
          type: boolean
          description: >-
            Deprecated alias for `created_in_platform`. Retained for backward
            compatibility.
      required:
        - airbase_id
        - created_in_airbase
        - created_in_platform
        - erp_reference_id
        - id
        - name
    PublicApiLedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID) of the ledger entry.
        airbase_id:
          type: string
          format: uuid
          readOnly: true
          description: Deprecated alias for ``id``. Retained for backward compatibility.
        erp_reference_id:
          type: string
          nullable: true
          readOnly: true
          description: Reference ID of the ledger entry in the ERP system.
        erp_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: URL to view the ledger entry in the ERP system.
        url:
          type: string
          format: uri
          readOnly: true
          description: URL to view the ledger entry in the platform dashboard.
        airbase_url:
          type: string
          format: uri
          readOnly: true
          description: Deprecated alias for ``url``. Retained for backward compatibility.
        type:
          allOf:
            - $ref: '#/components/schemas/LedgerEntryTypeEnum'
          description: Type of ledger entry (e.g. BILL, EXPENSE_REPORT, JOURNAL_ENTRY).
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/OperationStateEnum'
          description: Sync status of the ledger entry.
          readOnly: true
        error_message:
          type: string
          nullable: true
          description: Error message when the ledger entry is in SYNC_ERROR status.
        spend_owner:
          allOf:
            - $ref: '#/components/schemas/PublicApiSpendOwner'
          nullable: true
          readOnly: true
          description: The user who owns this spend.
        subsidiary:
          allOf:
            - $ref: '#/components/schemas/PublicApiSubsidiary'
          description: Subsidiary associated with this ledger entry.
        credit_mode:
          allOf:
            - $ref: '#/components/schemas/CreditModeEnum'
          readOnly: true
          description: |-
            Credit mode for the ledger entry.

            * `prefunded.wallet` - PREFUNDED_WALLET
            * `credit.airbase` - CREDIT_AIRBASE
            * `credit.svb` - CREDIT_SVB
            * `credit.amex` - CREDIT_AMEX
            * `credit.poa` - CREDIT_POA
            * `credit.byoc` - CREDIT_BYOC
        vendor:
          allOf:
            - $ref: '#/components/schemas/PublicApiVendor'
          nullable: true
          description: Vendor associated with this ledger entry.
        employee:
          allOf:
            - $ref: '#/components/schemas/PublicApiEmployee'
          nullable: true
          description: Employee associated with this ledger entry.
        invoice_number:
          type: string
          nullable: true
          readOnly: true
          description: Invoice number for bill or vendor payment entries.
        bank_account:
          allOf:
            - $ref: '#/components/schemas/PublicApiAccount'
          nullable: true
          readOnly: true
          description: Airbase bank account for card payment or vendor payment entries.
        ap_account:
          allOf:
            - $ref: '#/components/schemas/PublicApiAccount'
          nullable: true
          readOnly: true
          description: >-
            Accounts payable GL account for bill, vendor payment, vendor credit,
            or reimbursement entries.
        applied_to:
          nullable: true
          readOnly: true
          description: >-
            For vendor payments: list of bills and vendor credits this payment
            is applied to. and for reimbursement Payment, list of reimbursement
            requests this payment is applied to.
        receipt_link:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Signed URL to download the receipt or invoice file.
        entry_date:
          type: string
          format: date-time
          description: Date of the ledger entry in ISO 8601 format.
        payment_entry_date:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: Payment date for reimbursement entries (ISO 8601 date).
        currency:
          allOf:
            - $ref: '#/components/schemas/PublicApiCurrency'
          readOnly: true
          description: >-
            Currency of the ledger entry. Falls back to the currency derived
            from the underlying transaction (matching the logic used by the
            native LE sync) when the ledger entry's currency field is not
            populated. `erp_reference_id` is null when no GL Currency record
            exists for that ISO code yet. This field is always present on the
            list endpoint, but may be null on the retrieve endpoint if the
            ledger entry's currency is not yet resolved.
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: >-
            Total amount of the ledger entry in dollars. This field will be
            deprecated in favor of `amounts` in the future.
        transaction_tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicApiTag'
          description: Tags applied at the transaction level.
        notes:
          type: string
          nullable: true
          description: Notes or memo attached to the ledger entry.
        is_amortized:
          type: boolean
          description: Whether this ledger entry is amortized (prepaid).
        amortization_account:
          allOf:
            - $ref: '#/components/schemas/PublicApiAccount'
          nullable: true
          description: GL account used for the amortization schedule.
        amortization_start_date:
          type: string
          format: date-time
          nullable: true
          description: >-
            Transaction-level start date of the amortization period. For native
            amortization ERPs (e.g. Rillet), this date is also propagated to
            each line item unless the line item has its own amortization start
            date.
        amortization_end_date:
          type: string
          format: date-time
          nullable: true
          description: >-
            Transaction-level end date of the amortization period. For native
            amortization ERPs (e.g. Rillet), this date is also propagated to
            each line item unless the line item has its own amortization end
            date.
        expense_list:
          type: array
          items:
            $ref: '#/components/schemas/PublicApiLedgerEntryExpense'
          readOnly: true
          description: List of expense line items in the ledger entry.
        amounts:
          allOf:
            - $ref: '#/components/schemas/PublicApiAmounts'
          nullable: true
          readOnly: true
          description: >-
            Amount and currency breakdown across all relevant currency views
            (book/USD amount, original transaction currency, card-network
            settlement currency, and subsidiary GL currency). Individual keys
            are null when that view does not apply to this ledger entry type.
            Present on both the list and retrieve endpoints.
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryCustomFieldValue'
          readOnly: true
          description: Transaction-level custom field values on this ledger entry.
      required:
        - airbase_id
        - airbase_url
        - amortization_account
        - amortization_end_date
        - amortization_start_date
        - amounts
        - ap_account
        - applied_to
        - bank_account
        - credit_mode
        - currency
        - custom_fields
        - employee
        - entry_date
        - erp_reference_id
        - erp_url
        - expense_list
        - id
        - invoice_number
        - is_amortized
        - notes
