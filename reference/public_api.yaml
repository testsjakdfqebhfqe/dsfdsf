        Retrieve the current sync session status for the company.


        - Returns the current state of the sync session.

        - If no active session exists, returns a response with `status =
        NO_ACTIVE_SESSION` and all other fields set to `null`.

        - Only one session can be active per company at a time.


        ### Status Values


        | Status | Description |

        | --- | --- |

        | `IN_PROGRESS` | A sync session is active; the ERP is pushing entities
        |

        | `COMPLETE` | The sync session has been completed by the ERP |

        | `NO_ACTIVE_SESSION` | No active session exists for this company |


        ### Response Fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `session_id` | string (UUID) / null | Unique identifier of the
        session, or `null` if none |

        | `status` | string | `IN_PROGRESS`, `COMPLETE`, or `NO_ACTIVE_SESSION`
        |

        | `started_at` | string (ISO 8601) / null | When the session was
        started, or `null` |

        | `completed_at` | string (ISO 8601) / null | When the session was
        completed, or `null` |

        | `ttl_seconds` | integer / null | Remaining TTL in seconds, or `null` |


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns current session status |

        | 401 | Unauthorized — invalid or missing authentication token |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
