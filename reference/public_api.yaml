  /v1/accounting/subsidiaries/bulk_upsert/:
    post:
      operationId: Bulk Upsert Subsidiaries
      description: >-
        Create or update up to 500 GL subsidiaries in a single atomic request.


        > **Note:** GL subsidiaries are ERP master data entities used for ledger
        synchronization.

        > For read-only access to platform subsidiaries (company org units),

        > see `GET /v1/subsidiaries/`.


        ### Matching Key


        Subsidiaries are matched by `erp_reference_id` (case-insensitive).


        ### Unique Constraint


        `erp_reference_id` must be unique per integration. Empty / null
        `erp_reference_id`

        is exempt — multiple subsidiaries can have no reference ID.


        ### Required Fields per Entity


        `name`, `iso_code`


        ### Optional Fields per Entity


        `erp_reference_id`, `erp_parent_reference_id`,
        `erp_currency_reference_id`, `email`, `url`


        > **Note**: `iso_code` must be a valid ISO 3166-1 alpha-3 code.


        ### Common Error Responses


        **400 Bad Request — duplicate reference ID:**


        **400 Bad Request — invalid ISO country code:**


        **Common Behavior:**


        - **Atomic** — if any entity fails validation, no changes are persisted.

        - **Maximum 500 entities** per request.

        - Matched by `erp_reference_id` (case-insensitive); existing entities
        are updated, new ones are created.

        - `is_active` cannot be supplied — it is managed internally.

        - Empty or null `erp_reference_id` is exempt from uniqueness
        constraints.


        **Response:** `{"created": [...], "updated": [...]}`


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Validation errors, batch too large, or read-only mode |

        | 401 | Unauthorized |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
