        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpsertEmployeesRequestRequest'
            examples:
              BulkUpsertRequest:
                value:
                  entities:
                    - erp_reference_id: EMP-001
                      name: Jane Smith
                      email: jane.smith@example.com
                    - erp_reference_id: EMP-002
                      name: Bob Jones
                      erp_parent_reference_id: EMP-001
                      email: bob.jones@example.com
                summary: Create or update GL employees in bulk.
        required: true
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpsertSuccessResponse'
              examples:
