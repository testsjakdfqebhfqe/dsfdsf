components:
  schemas:
    AchPayment:
      type: object
      properties:
        account_name:
          type: string
        account_number:
          type: string
          nullable: true
        account_type:
          type: string
        routing_number:
          type: string
          nullable: true
        bank_name:
          type: string
      required:
        - account_name
        - account_number
        - account_type
        - bank_name
        - routing_number
    ActionEnum:
      enum:
        - START
        - COMPLETE
      type: string
      description: |-
        * `START` - START
        * `COMPLETE` - COMPLETE
    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country:
          type: string
      required:
        - city
        - country
        - line1
        - line2
        - state
        - zip_code
    Attachment:
      type: object
      properties:
        title:
          type: string
        category:
          nullable: true
          readOnly: true
          $ref: '#/components/schemas/CategoryEnum'
        uploaded_date:
          type: string
          format: date-time
        uploaded_by:
          $ref: '#/components/schemas/UserRef'
        url:
          type: string
          format: uri
      required:
        - category
        - title
        - uploaded_by
        - uploaded_date
        - url
    AverageMonthlySpend:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
      required:
        - amount
        - currency
    BlankEnum:
      enum:
        - ''
    BulkUpsert400Response:
      oneOf:
        - $ref: '#/components/schemas/BulkUpsertErrorResponse'
        - $ref: '#/components/schemas/PublicAPIError'
    BulkUpsertAccountsRequestRequest:
      type: object
      description: Request body for POST /v1/accounting/accounts/bulk_upsert/.
      properties:
        entities:
