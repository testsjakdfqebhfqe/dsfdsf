    PaymentTransactionRecord:
      type: object
      description: Serializer for a single payment transaction record.
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Unique transaction reference ID.
        created_date:
          type: string
          format: date-time
          description: The date (in UTC) when the transaction was authorized or initiated.
        posting_date:
          type: string
          format: date-time
          description: >-
            The specific date (in UTC) when the balance was updated in PCTY for
            Finance.
        description:
          type: string
          description: Description inscribed by the card or payment provider.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          description: The amount in the base currency.
        currency:
          type: string
          description: The base currency ISO code.
        transaction_currency_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          description: The amount that was paid in the transaction currency.
        transaction_currency:
          type: string
          description: The currency in which the transaction occurred.
        payment_product:
          allOf:
            - $ref: '#/components/schemas/PaymentProductEnum'
          description: Platform or partner product used to process the payment
        payment_method:
          allOf:
            - $ref: '#/components/schemas/PaymentMethodEnum'
          description: The type of payment associated with this transaction.
        type:
          allOf:
            - $ref: '#/components/schemas/PaymentTransactionRecordTypeEnum'
          description: Financial transaction category.
        status:
          allOf:
            - $ref: '#/components/schemas/PaymentTransactionRecordStatusEnum'
          description: Progress status of the transaction.
        is_real_time_sync:
          type: boolean
          description: >-
            Whether the transaction uses the Sync Payment Entry When Bill is
            Paid feature.
        invoice_number:
          type: string
          nullable: true
          description: The invoice number associated with the payment.
        bill_id:
          type: string
          format: uuid
          nullable: true
          description: The bill ID associated with the payment.
        expense_report_id:
          type: string
          format: uuid
          nullable: true
          description: The expense report ID associated with the transaction.
        vendor_payment_id:
          type: string
          format: uuid
          nullable: true
          description: Vendor payment identifier associated with the transaction.
        reimbursement_payment_id:
          type: string
          format: uuid
          nullable: true
          description: Reimbursement payment identifier associated with the transaction.
        vendor_id:
          type: string
          format: uuid
          nullable: true
          description: Vendor identifier associated with the transaction.
        vendor_name:
          type: string
          nullable: true
          description: The vendor's display name.
        gl_vendor_id:
          type: string
          format: uuid
          nullable: true
          description: The GL vendor ID.
        gl_vendor_name:
          type: string
          nullable: true
          description: The associated vendor in the General Ledger.
        subsidiary_id:
          type: string
          format: uuid
          nullable: true
          description: The subsidiary ID.
        subsidiary_name:
          type: string
          nullable: true
          description: The name of the subsidiary.
        spend_owner_id:
          type: string
          format: uuid
          nullable: true
          description: The spend owner's ID.
        spend_owner_name:
          type: string
          nullable: true
          description: The spend owner's name.
      required:
