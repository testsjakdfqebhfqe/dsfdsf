  /v1/accounting/ledger_entries/:
    get:
      operationId: List Ledger Entries
      description: >-
        Retrieve a paginated list of ledger entries for GL synchronisation.


        By default, only entries with `status=sync_ready` are returned. Use the
        `status`

        query parameter to retrieve entries in other states.


        ### Query Parameters


        | Parameter | Type | Required | Default | Description |

        | --- | --- | --- | --- | --- |

        | `status` | string | No | `sync_ready` | Filter by sync status.
        Allowed: `sync_ready`, `sync_complete`, `sync_error` |

        | `subsidiary` | UUID | No | — | Filter by GL subsidiary ID |

        | `ledger_entry_ids` | string | No | — | Comma-separated list of ledger
        entry UUIDs (bulk GET) |

        | `entry_date_start` | date | No* | — | Start date for entry date range
        filter (ISO 8601: YYYY-MM-DD) |

        | `entry_date_end` | date | No* | — | End date for entry date range
        filter (ISO 8601: YYYY-MM-DD) |

        | `page` | integer | No | 1 | Page number for pagination |

        | `page_size` | integer | No | 20 | Number of entries per page |


        > `entry_date_start` and `entry_date_end` must both be provided together
        — specifying only one returns a 400 error.


        ### Important Notes


        1. **Unknown parameters** — any unrecognised query parameter causes the
        endpoint to return an empty result set (not an error).

        2. **Date range validation** — start date cannot be after end date.

        3. **Default behaviour** — without a `status` filter, only `sync_ready`
        entries are returned.


        ### Sync Lifecycle


        1. Retrieve `sync_ready` entries.

        2. Post each entry to your ERP.

        3. `PATCH` the entry to `sync_complete` (success) or `sync_error`
        (failure).


        ### Status Values Reference


        | Status | Description |

        | --- | --- |

        | `sync_ready` | Entry is ready to be synced to ERP |

        | `sync_complete` | Entry has been successfully synced to ERP |

        | `sync_error` | Entry failed to sync — check `error_message` for
        details |

        | `sync_onhold` | Entry is on hold until parent operations are synced |


        > **Note**: The `status` query filter accepts `sync_ready`,
        `sync_complete`, and `sync_error`. The response may also include entries
        with `sync_onhold` status when parent entries have not yet completed
        syncing.


        ### Ledger Entry Types


        | Type | Description |

        | --- | --- |

        | `GPA_LOAD` | Money loaded from customer's bank into the GPA |

        | `GPA_UNLOAD` | Money unloaded from GPA to customer's bank |

        | `BANK_PAYMENT_LOAD` | Inbound transfer for a bank payment (ACH/check)
        |

        | `BANK_PAYMENT_UNLOAD` | Inbound reversal transfer for a bank payment |

        | `REFUND` | Refund on a virtual or physical card |

        | `CASHBACK` | Cashback reward transaction |

        | `VIRTUAL_CARD_PAYMENT` | Virtual card transaction |

        | `PHYSICAL_CARD_PAYMENT` | Physical card transaction |

        | `INTERSUBSIDIARY_WALLET_LOAD` | Card wallet internal transfer |

        | `BILL_PAYMENT` | Outbound transfer for ACH payment or check |

        | `VENDOR_PAYMENT_REVERSAL` | Reversal of a vendor payment |

        | `REIMBURSEMENT` | Employee expense reimbursement |

        | `REIMBURSEMENT_PAYMENT` | Reimbursement payment operation |

        | `VENDOR_CREDIT` | Vendor credit applied |

        | `AIRBASE_FEES` | Airbase platform fees |

        | `AIRBASE_INTERNAL_TRANSFER` | Internal fund transfer |

        | `FX_LOSS` | Foreign exchange loss |

        | `TRANSFER` | Generic transfer |

        | `PURCHASE_ORDER` | Purchase order |

        | `BILL` | Vendor bill |

        | `VENDOR_PAYMENT` | Payment applied to a bill (partial or full) |

        | `BATCH_VENDOR_PAYMENT` | Batch vendor payment |


        ### Credit Modes


        | Mode | Description |

        | --- | --- |

        | `prefunded.wallet` | Spend / move funds from the prefunded wallet |

        | `credit.airbase` | Spend / move funds using Airbase-provided credit |

        | `credit.svb` | Credit via SVB |

        | `credit.amex` | Credit via Amex |

        | `credit.byoc` | Credit via BYOC |

        | `credit.poa` | Credit via POA (Paid Outside Airbase) |


        ### Amortization Dates on Line Items


        Each line item in `expense_list` includes `amortization_start_date` and
        `amortization_end_date` fields.

        The behavior depends on the ERP's amortization mode:


        | Mode | Behavior |

        | --- | --- |

        | AIRBASE (default) | Dates only populated when the entry is amortized
        (`is_amortized=true`). Uses line-level date if set. |

        | Native amortization (e.g. Rillet) | Uses line-level date if set,
        otherwise falls back to the transaction-level date. |


        ### `amounts`


        A breakdown of each entry's amount across every relevant currency view,
        each

        expressed as `{"amount": <amount upto 2 decimal points>, "currency":
        {"erp_reference_id": <ERP currency ref or null>, "iso_code": "<ISO 4217
        code>"}}`

        (or `null` when that view does not apply to this entry type):


        | Key | Description |

        | --- | --- |

        | `amount` | The USD "book" amount. |

        | `transaction_amount` | Amount in the original transaction
        (merchant/vendor) currency. |

        | `settlement_amount` | Amount in the card-network settlement currency.
        `null` when there is no distinct settlement leg (e.g. bills,
        reimbursements). |

        | `subsidiary_amount` | Amount in the owning subsidiary's GL currency.
        `null` when it cannot be resolved. |


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Invalid query parameters or date range error |

        | 401 | Unauthorized — token missing or invalid |

        | 404 | Not found |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: List Ledger Entries
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - Ledger Entries
      security:
        - tokenAuth: []
      responses:
