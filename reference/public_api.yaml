tags:
  - name: Integration Guide
    description: >-
      # Integration Guide


      This guide covers the end-to-end workflow for integrating with the Airbase
      Accounting APIs. For endpoint-specific details, see the individual
      endpoint documentation in the OpenAPI specification.


      ______________________________________________________________________


      ## End-to-End Sync Lifecycle


      The typical integration follows this flow:


      ```

      1. Setup         →  Create GL entities (subsidiaries, accounts,
      currencies, vendors, employees, tags)

      2. Poll / Listen →  Retrieve sync-ready ledger entries (via API polling or
      webhooks)

      3. Sync to ERP   →  Post entries to your ERP system

      4. Update Status →  Mark entries as SYNC_COMPLETE or SYNC_ERROR in Airbase

      5. Prepayments   →  Repeat steps 2–4 for prepayment entries linked to
      synced ledger entries

      ```


      ### Step 1: GL Entity Setup


      Before syncing transactions, set up your chart of accounts and reference
      data:


      1. **Subsidiaries** — `POST /v1/accounting/subsidiaries` or bulk upsert

      2. **Currencies** — `POST /v1/accounting/currencies` or bulk upsert

      3. **Accounts** — `POST /v1/accounting/accounts` or bulk upsert

      4. **Vendors** — `POST /v1/accounting/vendors` or bulk upsert

      5. **Employees** — `POST /v1/accounting/employees` or bulk upsert

      6. **Tags** — `POST /v1/accounting/tags` or bulk upsert


      Use `bulk_upsert` (up to 500 entities per request) for initial data loads.
      Entities are matched by `erp_reference_id`.


      ### Step 2: Retrieve Sync-Ready Entries


      **Option A — Polling:**


      ```

      GET /v1/accounting/ledger_entries?status=SYNC_READY

      ```


      Poll periodically (e.g. every 5–15 minutes). Page through results until
      all entries are retrieved.


      **Option B — Webhooks:**

      Configure a webhook for `ledger.entry.sync.ready` to receive push
      notifications when entries become ready.


      ### Step 3: Sync to ERP


      For each entry, extract the line items, tags, and GL references, then
      create the corresponding journal entry in your ERP.


      ### Step 4: Update Status


      After syncing, update each entry:


      - **Success:** `PATCH /v1/accounting/ledger_entries/{airbase_id}` with
      `status: "SYNC_COMPLETE"` and `erp_reference_id`.

      - **Failure:** `PATCH` with `status: "SYNC_ERROR"` and `error_message`.


      For batch updates, use `POST /v1/accounting/ledger_entries/bulk_update`
      (up to 50 entries per request).


      ### Step 5: Prepayment Entries


      After syncing a parent ledger entry, retrieve and sync its prepayment
      entries:


      ```

      GET /v1/accounting/prepayment_entries?ledger_entry_id={parent_airbase_id}

      ```


      Update prepayment entry statuses the same way (PATCH or bulk_update).


      ______________________________________________________________________


      ## Pagination


      All list endpoints return paginated responses.


      | Parameter   | Type    | Default | Max  | Description             |

      | ----------- | ------- | ------- | ---- | ----------------------- |

      | `page`      | integer | 1       | —    | Page number (1-indexed) |

      | `page_size` | integer | 20      | 1000 | Results per page        |


      > **Payment Transactions** default to `page_size=250` with a max of
      `1000`.


      ### Response Shape


      ```json

      {
        "data": [...],
        "pagination": {
          "next": "https://api.airbase.io/v1/accounting/ledger_entries?page=2&page_size=20",
          "previous": null,
          "page": 1,
          "page_size": 20
        }
      }

      ```


      ### Iteration Pattern


      1. Request the first page.

      2. While `pagination.next` is not `null`, follow the `next` URL.

      3. Collect all `data` arrays.


      ______________________________________________________________________


      ## Rate Limits


      All API endpoints are subject to the global Airbase API rate limit. When
      the limit is exceeded, the API returns `429 Too Many Requests`. The
      response includes `X-RateLimit-Limit` (your per-minute limit) and
      `X-RateLimit-Remaining` (requests remaining in the current window)
      headers.


      ### Retry Strategy


      When you receive a `429 Too Many Requests` response:


      1. Use exponential backoff: wait `min(2^attempt × base_delay, 60s)`.

      2. Cap retries at 5 attempts.


      ### Idempotency


      - `bulk_update` and `PATCH` operations are idempotent — repeating the same
      request produces the same result.

      - GL entity `bulk_upsert` matches by the resource-specific unique key
      described in each entity doc, so re-sending the same payload is safe when
      the unique key does not change.


      ______________________________________________________________________


      ## Error Response Formats


      The API uses two error response formats depending on the context:


      ### 1. Structured Error (most endpoints)


      Returned for validation failures, duplicate entities, invalid UUIDs,
      read-only mode, and other domain errors.


      ```json

      {
        "error_code": 407000,
        "error_message": "Entity with same erp_reference_id already exists",
        "data": {"reference_id": "ACC-001"}
      }

      ```


      | Field           | Type           |
      Description                                       |

      | --------------- | -------------- |
      ------------------------------------------------- |

      | `error_code`    | integer        | Numeric error code identifying the
      error type     |

      | `error_message` | string         | Human-readable error
      description                  |

      | `data`          | object \| null | Optional additional context
      (field-level details) |


      ### 2. Detail Error (limited cases)


      Returned for certain error conditions such as unsupported HTTP methods,
      authentication failures, and specific not-found responses from update
      endpoints.


      ```json

      {
        "detail": "Method \"DELETE\" not allowed."
      }

      ```


      > **Note:** Most 404 responses use the **Structured Error** format above
      (`{error_code, error_message}`), *not* the detail format. The detail
      format is limited to update endpoints that explicitly return it.


      ### 3. Validation Error (field-level)


      Returned when request parameters or body fail validation.


      ```json

      {
        "entry_date": ["Both 'entry_date_start' and 'entry_date_end' must be provided together."],
        "status": ["\"INVALID\" is not a valid choice."]
      }

      ```


      Each key is a field name and the value is a list of error strings for that
      field.


      ______________________________________________________________________


      ## Common Errors — Cause & Fix


      | Error Code                         |
      Message                                                   |
      Cause                                                                          
      | Fix                                                                |

      | ---------------------------------- |
      --------------------------------------------------------- |
      -------------------------------------------------------------------------------
      | ------------------------------------------------------------------ |

      | `GL_ENTITY_DUPLICATE_EXISTS`       | Entity with same erp_reference_id
      already exists          | Attempting to create an entity with an
      `erp_reference_id` that's already in use | Use `bulk_upsert` instead, or
      update the existing entity via PATCH |

      | `GL_ENTITY_READ_ONLY_MODE_ENABLED` | Read-only mode is enabled for GL
      entities                 | The integration is in read-only mode (usually
      during initial setup)             | Contact your Airbase admin to disable
      read-only mode               |

      | `INVALID_UUID_ERROR`               | Invalid UUID
      format                                       | The `airbase_id` path
      parameter is not a valid UUID                             | Verify the
      UUID format (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)      |

      | `INVALID_REQUEST`                  | Invalid
      request                                           | Request body failed
      validation                                                  | Check the
      `data` field for specific field errors                   |

      | —                                  | `Authentication credentials were
      not provided.`           | Missing or invalid `Authorization`
      header                                       | Include `Authorization:
      Token <your_api_token>` in the request     |

      | —                                  | `Not
      found.`                                              | The entity with the
      given `airbase_id` doesn't exist or has been soft-deleted   | Verify the
      `airbase_id` is correct and the entity is active        |

      | —                                  | `error_message can only be set when
      status is SYNC_ERROR` | Attempted to set `error_message` without setting
      `status` to `SYNC_ERROR`       | Either remove `error_message` or set
      `status: "SYNC_ERROR"`        |


      ______________________________________________________________________


      ## Sync State Transitions


      ```
                       ┌───────────┐
          New entry →  │ SYNC_READY │
                       └─────┬─────┘
                             │
                    ┌────────┴────────┐
                    ▼                 ▼
           ┌──────────────┐   ┌────────────┐
           │ SYNC_COMPLETE │   │ SYNC_ERROR │
           └──────────────┘   └─────┬──────┘
                                    │ retry
                                    ▼
                              ┌───────────┐
                              │ SYNC_READY │
                              └───────────┘
      ```


      - Entries start as `SYNC_READY`.

      - After successful ERP sync, mark as `SYNC_COMPLETE`.

      - On failure, mark as `SYNC_ERROR` with an `error_message`.

      - To retry, set the status back to `SYNC_READY`.
  - name: Sync Session
    description: >
      Manage GL entity sync sessions during onboarding. Start a session before
      pushing GL entities, then complete it when all entities have been synced.


      During onboarding, the ERP pushes GL entities (accounts, subsidiaries,
      currencies, etc.) to the Platform. The sync session mechanism lets the ERP
      explicitly signal 'I'm starting a sync' and 'I'm done syncing.' The UI
      holds on a loading/progress screen until the session is marked complete or
      expires, preventing users from seeing partially synced data.


      ### Key Points


      - Sessions are scoped per company — any valid API token for the company
      can start, complete, or poll a session.

      - Sessions have a **60-minute TTL**. If not completed within 60 minutes
      they expire automatically.

      - Entity creation calls are completely independent of sessions and remain
      backward compatible.

      - Sessions can only be started when the company is in GL onboarding
      (onboarding not yet completed).

      - **Completing the session is mandatory** — until the session is marked
      complete, the UI will continue to display a 'sync in progress' screen,
      preventing the user from proceeding with onboarding.
  - name: Accounts
    description: >-
      Manage GL accounts synced from your ERP. Supports hierarchical chart of
      accounts via `erp_parent_reference_id`. Account types include: `bank`,
      `expense`, `expense_category`, `prepayment`, `accounts_payable`,
      `checking`, `credit_card`. Unique constraint: `erp_reference_id` + `type`
      must be unique per integration.
  - name: Currencies
    description: >-
      Manage GL currency entities synced from your ERP. Use ISO 4217 currency
      codes for `iso_code` (e.g. USD, EUR, GBP).
  - name: Subsidiaries
    description: >-
      Manage GL subsidiary (business entity / legal entity) records. Supports
      hierarchical structures via `erp_parent_reference_id`. Use ISO 3166-1
      alpha-3 country codes for `iso_code` (e.g. USA, GBR, CAN).
  - name: Vendors
    description: >-
      Manage GL vendor entities synced from your ERP. Supports multi-subsidiary
      assignment.
  - name: Employees
    description: >-
      Manage GL employee entities synced from your ERP. Supports
      multi-subsidiary assignment and organisational hierarchies via
      `erp_parent_reference_id`.
  - name: Tags
    description: >-
      Manage GL tags / financial dimensions (e.g. Department, Location, Class,
      Project). Composite unique constraint: `erp_reference_id` + `type_label` —
      the same reference ID is allowed across different type labels.
  - name: Ledger Entries
    description: >-
      Retrieve and update ledger entries for GL synchronisation. Ledger entries
      represent financial transactions ready to be synced to your ERP. The
      default filter is `status=SYNC_READY`. After syncing, PATCH each entry
      with `SYNC_COMPLETE` or `SYNC_ERROR`.
  - name: Prepayment Entries
    description: >-
      Retrieve and update prepayment (amortisation) entries linked to parent
      ledger entries. Always sync the parent ledger entry first, then sync
      associated prepayment entries.
  - name: Webhooks
    description: >-
      Airbase provides webhook notifications to inform your systems when ledger
      entries transition to a sync-ready state. This allows you to automatically
      trigger ERP sync workflows without polling the API, build real-time
      integrations, and reduce latency between Airbase and your ERP system.


      ## When Do Webhooks Fire?


      The sync-ready webhook fires when entries move to `sync_ready` **from
      within the Airbase platform**. This includes:


      - ✅ Transactions that complete settlement and are ready for export

      - ✅ Bills that are approved and ready for sync

      - ✅ Reimbursements that are approved and ready for sync

      - ✅ Entries marked as sync ready via the dashboard

      - ✅ Prepayment / amortisation entries that are generated and ready for
      sync


      The webhook does **not** fire when:


      - ❌ Status is updated via the Public API (prevents circular notifications)

      - ❌ Entries are already in `sync_ready` state (no duplicate notifications)


      ## Available Events


      | Event Name                  | Event Key                     |
      Description                                                             |

      | --------------------------- | ----------------------------- |
      ----------------------------------------------------------------------- |

      | Ledger Entry Sync Ready     | `ledger.entry.sync.ready`     | Fired when
      one or more ledger entries are ready to be synced to ERP     |

      | Prepayment Entry Sync Ready | `prepayment.entry.sync.ready` | Fired when
      one or more prepayment entries are ready to be synced to ERP |


      ## Setting Up Webhooks


      ### Step 1: Navigate to Webhook Settings


      1. Log in to your Airbase account.

      2. Go to **Settings → Tokens & Webhooks** or navigate directly to:
         - Production: `https://dashboard.airbase.io/settings/tokens-webhooks/tokens`
         - Staging: `https://stage.airbase.io/settings/tokens-webhooks/tokens`
      3. Click **Add Webhook**.


      ### Step 2: Configure the Webhook


      | Field                 |
      Description                                                |

      | --------------------- |
      ---------------------------------------------------------- |

      | **URL**               | The HTTPS endpoint where Airbase will send
      webhook events  |

      | **Events**            | Select `ledger.entry.sync.ready` from the
      available events |

      | **Secret** (optional) | A shared secret used to verify webhook
      signatures          |


      ### Step 3: Prepare Your Endpoint


      > **Important**: Your webhook endpoint must be a publicly accessible URL
      that accepts unauthenticated `POST` requests. Airbase sends payloads
      directly without authentication headers (other than the optional signature
      for verification).


      Ensure your endpoint:


      - Is publicly accessible (open endpoint)

      - Accepts `POST` requests without authentication

      - Returns a `2xx` status code within 30 seconds

      - Handles JSON payloads with `Content-Type: application/json`


      ## Payload Structure


      ```json

      {
        "event": "ledger.entry.sync.ready",
        "timestamp": "2026-02-23T14:30:00.000Z",
        "data": {
          "entries": [
            {
              "id": "123e4567-e89b-12d3-a456-426614174000",
              "airbase_id": "123e4567-e89b-12d3-a456-426614174000",
              "state": "sync_ready",
              "type": "card_payment",
              "created_date": "2026-02-23T10:15:30.000Z",
              "updated_date": "2026-02-23T14:30:00.000Z"
            },
            {
              "id": "223e4567-e89b-12d3-a456-426614174001",
              "airbase_id": "223e4567-e89b-12d3-a456-426614174001",
              "state": "sync_ready",
              "type": "bill",
              "created_date": "2026-02-22T09:00:00.000Z",
              "updated_date": "2026-02-23T14:30:00.000Z"
            }
          ]
        }
      }

      ```


      ## Payload Field Reference


      ### Entry Object


      Each entry in the `entries` array contains:


      | Field          | Type     |
      Description                                                                                                                                                     
      |

      | -------------- | -------- |
      ----------------------------------------------------------------------------------------------------------------------------------------------------------------
      |

      | `id`           | UUID     | Unique identifier for the ledger sync
      operation. Use this ID to fetch full details via the Ledger Entries
      API.                                                   |

      | `airbase_id`   | UUID     | **Deprecated** — legacy alias for `id`.
      Still emitted in every payload during the partner migration window and
      will be removed in a future release. Prefer `id`. |

      | `state`        | string   | Current state of the entry (always
      `sync_ready` for these
      events).                                                                                              
      |

      | `type`         | string   | Type of ledger entry (see Entry Types
      below).                                                                                                                   
      |

      | `created_date` | ISO 8601 | Timestamp when the sync operation was
      created.                                                                                                                  
      |

      | `updated_date` | ISO 8601 | Timestamp when the sync operation was last
      updated.                                                                                                             
      |


      ### Entry Types


      | Type             | Description                      |

      | ---------------- | -------------------------------- |

      | `card_payment`   | Credit / debit card transaction  |

      | `bill`           | Vendor bill or invoice           |

      | `bill_payment`   | Payment made against a bill      |

      | `reimbursement`  | Employee reimbursement           |

      | `vendor_credit`  | Credit from a vendor             |

      | `cashback`       | Cashback reward                  |

      | `purchase_order` | Purchase order                   |

      | `prepayment`     | Prepayment or amortisation entry |


      ### Entry States


      | State              | Description                        |

      | ------------------ | ---------------------------------- |

      | `sync_ready`       | Entry is ready to be synced to ERP |

      | `sync_in_progress` | Sync is currently in progress      |

      | `sync_complete`    | Entry has been successfully synced |

      | `sync_error`       | Sync failed with an error          |


      ## Best Practices


      1. **Respond quickly** — return a `2xx` response immediately on receipt
      and process asynchronously.

      2. **Handle duplicates** — webhooks may occasionally be delivered more
      than once. Use the `id` as an idempotency key to skip already-processed
      entries.

      3. **Verify signatures** — if you configured a webhook secret, verify the
      `X-Airbase-Signature` header using HMAC-SHA256 to confirm the request
      originates from Airbase.


      ## Recommended Workflow


      1. Receive the webhook payload.

      2. Use each entry's `id` to fetch full details via `GET
      /v1/accounting/ledger_entries/{id}`.

      3. Sync the entry to your ERP.

      4. Update the entry status in Airbase via `PATCH
      /v1/accounting/ledger_entries/{id}` (set `status` to `SYNC_COMPLETE` or
      `SYNC_ERROR`).


      ## Troubleshooting


      | Symptom               |
      Resolution                                                                                                           
      |

      | --------------------- |
      ---------------------------------------------------------------------------------------------------------------------
      |

      | Webhook not received  | Verify the endpoint URL is publicly accessible,
      the event is enabled, and firewall rules allow inbound POST requests. |

      | Duplicate deliveries  | Implement idempotent processing using
      `id`.                                                                          
      |

      | Missing entry details | The webhook payload is intentionally minimal.
      Fetch full details via the Ledger Entries API.                          |
