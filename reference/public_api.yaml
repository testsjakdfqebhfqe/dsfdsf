    patch:
      operationId: Update Ledger Entry
      description: >-
        Update a ledger entry with synchronisation results from your ERP system.
        Use this endpoint

        to mark entries as synced, record errors, or store the ERP journal entry
        reference.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | UUID | Yes | The unique identifier of the ledger entry to
        update. The path segment historically named `airbase_id` continues to
        accept the same UUID. |


        ### Request Body


        | Field | Type | Required | Description |

        | --- | --- | --- | --- |

        | `status` | string | No | New status. Allowed: `sync_ready`,
        `sync_error`, `sync_complete` |

        | `erp_reference_id` | string | No | The journal entry reference ID
        assigned in your ERP |

        | `erp_url` | string (URL) | No | Direct URL to the entry in your ERP
        system |

        | `error_message` | string | No | Error description (only valid when
        `status` is `sync_error`) |


        > At least one field must be provided.


        ### Validation Rules


        1. The request must include at least one of: `status`,
        `erp_reference_id`, `erp_url`, `error_message`.

        2. `error_message` can only be provided when `status` is `sync_error`.


        ### When a ledger entry transitions to `sync_complete`


        Dependent entries that were blocked on this entry's completion may
        automatically transition to `sync_ready`.


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns the updated ledger entry |

        | 400 | Invalid payload or validation error |

        | 401 | Unauthorized |

        | 404 | No ledger entry matches the provided ID |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
