              schema:
                $ref: '#/components/schemas/PublicAPIError'
              examples:
                405—MethodNotAllowed:
                  value:
                    error_code: 407109
                    error_message: method_not_allowed
                  summary: An unsupported HTTP method was used.
          description: ''
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


            The response body is empty. Check the `X-RateLimit-Limit` and
            `X-RateLimit-Remaining` headers for quota details.
  /v1/vendors/{id}/:
    get:
      operationId: Get Vendor Details
      description: >-
        Retrieve the full detail of a single vendor by its `id` (UUID).


        Includes contact, address, tax details, and payment details. Bank
        account

        numbers and IBAN are masked to their last 4 characters. Attachments
        include a

        temporary signed download URL that expires after 1 hour.


        ### Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | uuid | Yes | The vendor's unique identifier |


        ---


        ## Response Field Reference


        | Field | Type | Description |

        | --- | --- | --- |

        | `id` | uuid | Vendor ID |

        | `name` | string | Vendor display name |

        | `vendor_status` | enum | Public vendor status: `active`, `inactive`,
        `pending`, or `merged` |

        | `vendor_type` | enum | Vendor classification: `company` or
        `individual` |

        | `primary_email` | string / null | Primary contact email |

        | `preferred_currency` | string / null | Preferred invoice currency as
        an ISO 4217 code |

        | `preferred_country` | string | Preferred country as an ISO 3166-1
        alpha-2 code |

        | `description` | string | Free-text vendor description |

        | `onboarding_status` | enum | `not_invited`, `invited`, or `onboarded`
        |

        | `payment_terms` | string | Payment terms (e.g. `net_30`) |

        | `average_monthly_spend` | object / null | Average monthly spend,
        always in the company's USD terms; `null` when unavailable |

        | `average_monthly_spend.amount` | string (decimal) | Average monthly
        spend amount |

        | `average_monthly_spend.currency` | string | Currency of the amount —
        always `USD` |

        | `default_spend_owner` | object / null | The vendor's default spend
        owner; `null` if none |

        | `default_spend_owner.name` | string | Spend owner's full name |

        | `default_spend_owner.email` | string | Spend owner's email |

        | `created_by` | object | The user who created the vendor |

        | `created_by.name` | string | Creator's full name |

        | `created_by.email` | string | Creator's email |

        | `gl_vendor` | object / null | Linked GL vendor entity; `null` if not
        linked |

        | `gl_vendor.id` | uuid / null | GL vendor ID |

        | `gl_vendor.erp_reference_id` | string | GL vendor reference ID in the
        ERP |

        | `gl_vendor.name` | string | GL vendor name |

        | `website` | string / null | Vendor website URL |

        | `contact` | object | Primary contact details |

        | `contact.first_name` | string | Contact first name |

        | `contact.last_name` | string | Contact last name |

        | `contact.phone` | string | Contact phone number |

        | `contact.service_website_url` | string / null | Service website URL |

        | `address` | object | Vendor address |

        | `address.line1` | string | Address line 1 |

        | `address.line2` | string | Address line 2 |

        | `address.city` | string | City |

        | `address.state` | string | State / province |

        | `address.zip_code` | string | Postal / ZIP code |

        | `address.country` | string | Country |

        | `payment_details` | object | Configured payment methods. Each
        sub-block appears only when that method is configured for the vendor |

        | `payment_details.ach` | object | ACH payment details (present when ACH
        is configured) |

        | `payment_details.ach.account_name` | string | Bank account holder name
        |

        | `payment_details.ach.account_number` | string / null | Bank account
        number, masked to the last 4 characters |

        | `payment_details.ach.account_type` | string | Bank account type (e.g.
        `checking`) |

        | `payment_details.ach.routing_number` | string / null | ACH routing
        number (not masked) |

        | `payment_details.ach.bank_name` | string | Bank name |

        | `payment_details.check` | object | Check payment details (present when
        check is configured) |

        | `payment_details.check.pay_to` | string | Payee name printed on the
        check |

        | `payment_details.check.additional_details` | string | Additional
        address details printed on the check |

        | `payment_details.check.check_deliverability` | enum | `deliverable` or
        `non_deliverable` |

        | `payment_details.check.address` | object | Check mailing address |

        | `payment_details.card` | object | Card payment details (present for
        US-bank-country vendors) |

        | `payment_details.card.accepts_card_payments` | boolean | Whether the
        vendor accepts card payments |

        | `payment_details.card.share_card_details_with_vendor` | boolean |
        Whether virtual card details are shared with the vendor |

        | `payment_details.international` | object | International wire details
        (present when configured) |

        | `payment_details.international.account_number` | string | Account
        number, masked to the last 4 characters |

        | `payment_details.international.local_account_number` | string | Local
        account number, masked to the last 4 characters |

        | `payment_details.international.routing_number` | string | Routing
        number (not masked) |

        | `payment_details.international.iban` | string | IBAN, masked to the
        last 4 characters |

        | `payment_details.international.swift_bic_code` | string | SWIFT / BIC
        code (not masked) |

        | `payment_details.international.invoice_currency` | string / null |
        Invoice currency as an ISO 4217 code |

        | `payment_details.international.classification` | string | Account
        classification (e.g. `business`) |

        | `payment_details.international.bank_name` | string | Bank name |

        | `payment_details.international.bank_country` | string | Bank country |

        | `payment_details.international.bank_region` | string | Bank region /
        state |

        | `payment_details.international.bank_city` | string | Bank city |

        | `payment_details.international.bank_address1` | string | Bank address
        line 1 |

        | `payment_details.international.bank_address2` | string / null | Bank
        address line 2 |

        | `payment_details.international.bank_zip_code` | string | Bank postal /
        ZIP code |

        | `payment_details.paid_outside_airbase` | object | Paid-outside-Airbase
        details (present when configured) |

        | `payment_details.paid_outside_airbase.gl_cash_account` | string / null
        | GL cash account reference ID |

        | `payment_details.paid_outside_airbase.payment_method` | string / null
        | Payment method used outside Airbase |

        | `payment_details.paid_outside_airbase.notes` | string / null |
        Free-text notes |

        | `payment_details.paid_outside_airbase.sync_payment_entries` | boolean
        | Whether payment entries are auto-synced |

        | `tax_details` | object | Tax details |

        | `tax_details.tax_id` | string | The vendor's tax ID |

        | `tax_details.tax_id_type` | string | Tax ID type (e.g. `us`) |

        | `tax_details.tax_id_validation_status` | string | Tax ID validation
        status (e.g. `validated_by_airbase`) |

        | `tax_details.legal_name` | string | Legal name |

        | `tax_details.tax_subsidiary` | string / null | Tax subsidiary name |

        | `send_notifications` | boolean | Whether vendor notifications are
        enabled |

        | `payment_notification_email` | string / null | Email for payment
        notifications |

        | `route_invoices_to_subsidiaries` | boolean | Whether invoices are
        routed to subsidiaries |

        | `invoice_inbox_subsidiaries` | array (string) | Names of subsidiaries
        allowed for invoice routing |

        | `custom_sections` | array | Custom-field sections configured for the
        vendor |

        | `custom_sections[].name` | string | Section name |

        | `custom_sections[].elements` | array | Elements within the section |

        | `custom_sections[].elements[].label` | string | Element label |

        | `custom_sections[].elements[].type` | string | Element type (e.g.
        `LIST_SELECT`, `ATTACHMENT`, `MONETARY_VALUE`) |

        | `custom_sections[].elements[].user_input` | any / null | Element
        value; shape depends on `type` |

        | `attachments` | array | Vendor file attachments |

        | `attachments[].title` | string | File name |

        | `attachments[].category` | enum / null | File category (e.g. `w9`);
        `null` if uncategorized |

        | `attachments[].uploaded_date` | string (date-time) | When the file was
        uploaded |

        | `attachments[].uploaded_by` | object | Uploader (`name`, `email`) |

        | `attachments[].url` | string (uri) | Temporary presigned download URL
        (expires after ~1 hour) |

        | `merged_to` | uuid / null | UUID of the primary vendor this vendor was
        merged into; `null` unless `vendor_status` is `merged` |

        | `created_at` | string (date-time) | When the vendor was created |

        | `updated_at` | string (date-time) | When the vendor was last modified
        |


        All timestamps are UTC ISO 8601. Monetary amounts are decimal strings;
        parse

        them as decimals rather than assuming a fixed number of decimal places.


        ---


        ### Response Codes


        | Code | Description |

        | --- | --- |

        | 200 | Success — returns the vendor detail |

        | 401 | Unauthorized |

        | 403 | Forbidden — Vendor Management API not enabled for this company |

        | 404 | Vendor not found |

        | 429 | Rate limit exceeded |
