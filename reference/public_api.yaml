  /v1/accounting/tags/bulk_upsert/:
    post:
      operationId: Bulk Upsert Tags
      description: >-
        Create or update up to 500 GL tags in a single atomic request.


        ### Matching Key


        Tags are matched by the composite key: `erp_reference_id` +
        `type_label`.

        Both fields must be present to match an existing tag.


        ### Unique Constraint


        - The combination of `erp_reference_id` + `type_label` must be unique
        per integration.

        - This means the same `erp_reference_id` value can exist multiple times
        as long as each occurrence has a different

        `type_label`.

        - erp_parent_reference_id, if provided, must refer to an existing tag in
        the Platform, belong to same type_label and

        must not create circular references.


        ### Required Fields per Entity


        `name`, `type_label`


        ### Optional Fields per Entity


        `erp_reference_id`, `erp_parent_reference_id`,
        `subsidiary_reference_ids`


        ### Common Error Responses


        **400 Bad Request — duplicate reference ID + type_label:**


        **400 Bad Request — missing type_label:**


        **Common Behavior:**


        - **Atomic** — if any entity fails validation, no changes are persisted.

        - **Maximum 500 entities** per request.

        - Matched by `erp_reference_id` (case-insensitive); existing entities
        are updated, new ones are created.

        - `is_active` cannot be supplied — it is managed internally.

        - Empty or null `erp_reference_id` is exempt from uniqueness
        constraints.


        **Response:** `{"created": [...], "updated": [...]}`


        **Response Codes:**


        | Code | Description |

        | --- | --- |

        | 200 | Success |

        | 400 | Validation errors, batch too large, or read-only mode |

        | 401 | Unauthorized |

        | 429 | Rate limit exceeded. Response includes `X-RateLimit-Limit` and
        `X-RateLimit-Remaining` headers |
      summary: Bulk Upsert Tags
      tags:
        - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpsertTagsRequestRequest'
            examples:
              BulkUpsertRequest:
                value:
                  entities:
                    - erp_reference_id: TAG-ENG
                      name: Engineering
                      type_label: Department
                    - erp_reference_id: TAG-BE
                      name: Backend
                      type_label: Department
                      erp_parent_reference_id: TAG-ENG
                    - erp_reference_id: TAG-NYC
                      name: New York
                      type_label: Location
                summary: Create or update GL tags in bulk.
        required: true
      security:
        - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpsertSuccessResponse'
              examples:
                BulkUpsertResponse:
                  value:
                    created:
                      - id: 1a911111-e89b-12d3-a456-426614174000
                        airbase_id: 1a911111-e89b-12d3-a456-426614174000
                        erp_reference_id: TAG-ENG
                        name: Engineering
                        type_label: Department
                        is_active: true
                    updated:
                      - id: 1a922222-e89b-12d3-a456-426614174001
                        airbase_id: 1a922222-e89b-12d3-a456-426614174001
                        erp_reference_id: TAG-BE
                        name: Backend
                        type_label: Department
                        is_active: true
                  summary: Response showing created and updated tags.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpsert400Response'
              examples:
                ValidationErrors:
                  value:
                    validation_errors:
                      - index: 0
                        erp_reference_id: ACC-001
                        error:
                          name:
                            - This field is required.
                  summary: Validation errors for bulk upsert
                BatchTooLarge:
                  value:
                    error_code: 400100
                    error_message: Invalid request
                    data:
                      entities:
                        - >-
                          Batch size of 501 exceeds the maximum allowed limit of
                          500.
                  summary: Batch size exceeds maximum
                DuplicateReferenceIDAndTypeLabel:
                  value:
                    error_code: 407000
                    error_message: >-
                      Entity with same erp_reference_id and type_label already
                      exists
                    data:
                      reference_id: TAG-001
                      type_label: Department
                  summary: Duplicate ERP reference ID for the same tag type.
                MissingTypeLabel:
                  value:
                    error_code: 400100
                    error_message: Invalid request
                    data:
                      type_label:
                        - This field is required.
                  summary: Validation failure when type_label is missing.
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '429':
          description: >-
            Request was throttled. Too many requests (500
            requests/minute/company).


